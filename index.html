<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#14233B">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contractor Nexus · ระบบบริหารงานติดตั้ง</title>
<meta name="description" content="Contractor Nexus ระบบบริหารงานติดตั้งเฟอร์นิเจอร์และผู้รับเหมา — Admin, Sale, จัดซื้อ, ผู้รับเหมา">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Contractor Nexus — V7
   Tokens: ink (โครงหลัก) · paper (พื้นหลัง) · brass (เมนูที่เลือก/วัสดุ) · action (ปุ่มหลัก) · สีสถานะ */
:root{
  --ink:#14233B; --ink-2:#1C3150; --ink-3:#2A4468; --ink-text:#16202E;
  --paper:#F2F4F7; --surface:#FFFFFF; --surface-2:#F7F9FB; --line:#DFE4EA; --line-2:#C9D1DB;
  --text-2:#4A5568; --text-3:#7A8594;
  --brass:#B8862F; --brass-bg:#FBF3E2;
  --action:#1E5BA8; --action-2:#174B8C; --action-bg:#E8F0FB;
  --blue:#1E5BA8; --blue-bg:#E8F0FB;
  --amber:#9A6206; --amber-bg:#FDF1DA;
  --teal:#0E7466; --teal-bg:#DDF3EF;
  --violet:#6A4BC4; --violet-bg:#EFEAFB;
  --orange:#C25A0F; --orange-bg:#FDEBDD;
  --green:#237A4B; --green-bg:#E3F3E9;
  --red:#BE3A31; --red-bg:#FBE7E5;
  --gray:#5F6B7A; --gray-bg:#EDF0F4;
  --r-lg:14px; --r:10px; --r-sm:8px;
  --shadow:0 1px 2px rgba(20,35,59,.06),0 6px 18px rgba(20,35,59,.05);
  --font:'IBM Plex Sans Thai','Sarabun','Noto Sans Thai','Leelawadee UI','Tahoma',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.55;color:var(--ink-text);background:#E6E9EE}
h1,h2,h3,h4{margin:0;line-height:1.3;color:var(--ink)}
h1{font-size:23px;font-weight:700} h2{font-size:17px;font-weight:600} h3{font-size:15.5px;font-weight:600} h4{font-size:14.5px;font-weight:600}
p{margin:0 0 .6em}
a{color:var(--action);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ico.sm{width:15px;height:15px;vertical-align:-2px}.ico.xs{width:13px;height:13px;vertical-align:-2px}.ico.lg{width:26px;height:26px}
:focus-visible{outline:2px solid var(--action);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-3)}.small{font-size:13.5px}.xs{font-size:12.5px}.strong{font-weight:600}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
.hidden{display:none!important}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.spacer{flex:1}

/* ---------- พื้นที่แอป (ความกว้างแอปใช้ตัดสินเลย์เอาต์มือถือ) ---------- */
#app{container-type:inline-size;container-name:app;min-height:100vh;background:var(--paper)}

/* ---------- โครงแอป ---------- */
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh;position:relative;background:linear-gradient(to right,var(--ink) 244px,var(--paper) 244px)}
.side{background:var(--ink);color:#C5D0DF;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .brand{display:flex;gap:10px;align-items:center;padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.side .brand .bm{width:34px;height:34px;border-radius:9px;background:var(--ink-3);display:flex;align-items:center;justify-content:center}
.side .brand b{display:block;color:#fff;font-size:15px;line-height:1.2}.side .brand span{font-size:12px;color:#93A3BA}
.side .who{margin:12px 12px 4px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.05);display:flex;gap:10px;align-items:center}
.side .who .av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px;flex:none}
.side .who .nm{color:#fff;font-size:13.5px;font-weight:600;line-height:1.25}
.nav{padding:8px 10px;flex:1}
.nav .sec{font-size:12px;color:#7F90A8;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:#C5D0DF;font-size:14.5px;margin:1px 0;text-decoration:none}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:var(--ink-3);color:#fff;box-shadow:inset 3px 0 0 var(--brass)}
.nav a .cnt{margin-left:auto;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;font-size:11.5px;padding:0 7px;line-height:19px}
.nav a .cnt.warn{background:#C98A1B}
.side .foot{padding:12px 16px;font-size:12px;color:#7F90A8;border-top:1px solid rgba(255,255,255,.07)}
.side .foot button{background:none;border:0;color:#AFC0DA;cursor:pointer;padding:0;display:flex;gap:6px;align-items:center;font-size:13px}
.app-main{min-width:0;display:flex;flex-direction:column}
.mtop{display:none;align-items:center;gap:10px;padding:10px 14px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:20}
.mtop button{background:none;border:0;color:#fff;padding:4px;cursor:pointer}
.mtop b{font-size:15px}
.content{padding:22px 26px 40px;max-width:1320px;width:100%}
.viewas{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 26px;background:var(--brass-bg);border-bottom:1px solid #EBD9B0;font-size:13.5px;color:#6B4E15}
.viewas b{color:#4B360B}.viewas select{border:1px solid #D9C08A;border-radius:7px;padding:3px 8px;background:#fff}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-head .sub{color:var(--text-2);font-size:14px;margin-top:4px;max-width:760px}
.crumb{font-size:13px;color:var(--text-3);margin-bottom:4px}

/* ---------- ส่วนประกอบ ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:#fff;color:var(--ink-text);font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2);text-decoration:none}
.btn.primary{background:var(--action);border-color:var(--action);color:#fff}.btn.primary:hover{background:var(--action-2)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{background:#fff;border-color:#E4B4AF;color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--action)}
.btn.sm{height:32px;padding:0 11px;font-size:13.5px}.btn.xs{height:27px;padding:0 9px;font-size:12.5px;gap:5px}
.btn.lg{height:46px;font-size:15.5px;padding:0 18px}.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.grid > .card,.grid > .card + .card{margin-top:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{display:flex;gap:8px;align-items:center}
.card-b{padding:16px 18px}
.card-f{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.badge{display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.badge.plain::before{display:none}
.t-blue{background:var(--blue-bg);color:var(--blue)}.t-amber{background:var(--amber-bg);color:var(--amber)}.t-teal{background:var(--teal-bg);color:var(--teal)}
.t-violet{background:var(--violet-bg);color:var(--violet)}.t-orange{background:var(--orange-bg);color:var(--orange)}.t-green{background:var(--green-bg);color:var(--green)}
.t-red{background:var(--red-bg);color:var(--red)}.t-gray{background:var(--gray-bg);color:var(--gray)}
.t-brass{background:var(--brass-bg);color:#8A6420}
.role{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;flex:none}
.r-admin{background:var(--ink)}.r-sale{background:var(--blue)}.r-purchasing{background:var(--teal)}.r-contractor{background:var(--orange)}
.r-accounting{background:#8A6420}.r-installer{background:var(--violet)}.r-warehouse{background:#2F5D7C}
.notice{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--r);font-size:14px;border:1px solid}
.notice .ico{margin-top:2px}
.n-info{background:var(--blue-bg);border-color:#C3D5EF;color:#1E3F6D}.n-warn{background:var(--amber-bg);border-color:#EDD3A0;color:#6B4505}
.n-danger{background:var(--red-bg);border-color:#EDBDB8;color:#7C2620}.n-ok{background:var(--green-bg);border-color:#BADFC8;color:#1B5A37}
.n-secret{background:#FFF7F6;border-color:#EDC4BF;color:#7C2620}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:12.5px;font-weight:600;color:var(--text-3);padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.t td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:#F8FAFD}
.t .r{text-align:right}.t .c{text-align:center}
.t .sub{font-size:12.5px;color:var(--text-3)}
.t tr.blocked td{background:#FFFAF9}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:inherit}
.kpi:hover{text-decoration:none}
.kpi .k{font-size:13px;color:var(--text-2);display:flex;gap:6px;align-items:center}
.kpi .v{font-size:28px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .s{font-size:12.5px;color:var(--text-3)}
.kpi.accent{border-top:3px solid var(--k,var(--action))}
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 16px;margin:0;font-size:14px}
.dl dt{color:var(--text-3)}.dl dd{margin:0;min-width:0}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label{font-size:13.5px;font-weight:600;color:var(--text-2)}
.field .req{color:var(--red)}
.input,.select,.textarea{width:100%;border:1px solid var(--line-2);border-radius:var(--r-sm);background:#fff;padding:8px 11px;font-size:14.5px;min-height:40px}
.textarea{min-height:80px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--action);box-shadow:0 0 0 3px rgba(30,91,168,.14)}
.addon{display:flex}.addon .input{border-radius:var(--r-sm) 0 0 var(--r-sm)}.addon span{display:flex;align-items:center;padding:0 11px;border:1px solid var(--line-2);border-left:0;border-radius:0 var(--r-sm) var(--r-sm) 0;background:var(--surface-2);color:var(--text-2);font-size:13.5px;white-space:nowrap}
.help{font-size:12.5px;color:var(--text-3)}
.field.invalid .input,.field.invalid .select,.field.invalid .textarea{border-color:var(--red)}
.field .err{font-size:12.5px;color:var(--red);display:none}.field.invalid .err{display:block}
.form-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px 16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
.c2{grid-column:span 2}   /* V7.13 */
.check{display:inline-flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:14px}
.check input{width:17px;height:17px;margin-top:3px;accent-color:var(--action)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 13px;cursor:pointer;font-size:13.5px;color:var(--text-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--text-2)}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fchip .n{opacity:.7;margin-left:3px}
.empty{padding:34px 18px;text-align:center;color:var(--text-3)}
.empty .ico{width:34px;height:34px;color:var(--line-2);margin-bottom:8px}
.empty h3{color:var(--text-2);margin-bottom:4px}
.divider{height:1px;background:var(--line);margin:16px 0}
.sec-t{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font-weight:600;font-size:16px;color:var(--ink)}
.sec-t .n{background:var(--ink);color:#fff;border-radius:999px;font-size:12px;padding:0 8px;line-height:20px}
.money{font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- วัสดุ: ประเภทงาน (HG / Membrane / เมลามีน) ---------- */
.sw{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;padding:2px 9px 2px 3px;border-radius:999px;background:#F1F3F6;border:1px solid var(--line);white-space:nowrap}
.sw i{width:18px;height:18px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.mat-HG{background:linear-gradient(128deg,#1D2A3D 0%,#33476A 38%,#E9EFF7 47%,#7D93B3 52%,#2B3E5E 62%,#1A2639 100%)}
.mat-Membrane{background:radial-gradient(ellipse at 30% 22%,#FFFFFF 0%,#EFEBE4 40%,#DCD5C9 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1),inset 0 -3px 6px rgba(80,60,30,.12)}
.mat-Melamine{background:repeating-linear-gradient(97deg,#C99F6C 0 2px,#B88A57 2px 4px,#D6B386 4px 9px,#BF9361 9px 11px,#CFA978 11px 15px)}
.mat-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mat-tile{position:relative;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;overflow:hidden;display:flex;flex-direction:column}
.mat-tile .face{height:78px;position:relative}
.mat-tile .face .chk{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;color:var(--action);opacity:0;transition:opacity .15s}
.mat-tile .lbl{padding:9px 12px 10px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mat-tile .lbl b{font-size:15.5px}.mat-tile .lbl span{font-size:12.5px;color:var(--text-3)}
.mat-tile input{position:absolute;opacity:0;pointer-events:none}
.mat-tile.on{border-color:var(--action);box-shadow:0 0 0 3px rgba(30,91,168,.14)}
.mat-tile.on .chk{opacity:1}
.mat-tile:focus-within{outline:2px solid var(--action);outline-offset:2px}
.type-rows{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.type-row{display:grid;grid-template-columns:150px minmax(0,1fr) 180px;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.type-row .fee{text-align:right}
.type-row .fee b{display:block;font-size:16px;color:var(--teal)}
.fee-total{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--teal-bg);color:#0B5A50;flex-wrap:wrap}
.fee-total b{font-size:21px}

/* ---------- นับถอยหลัง ---------- */
.cd{display:inline-flex;flex-direction:column;gap:4px;min-width:170px}
.cd .cd-t{display:flex;gap:6px;align-items:center;font-size:13.5px;font-weight:600;color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap}
.cd .cd-bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.cd .cd-bar i{display:block;height:100%;background:var(--blue);border-radius:4px}
.cd.soon .cd-t{color:var(--orange)}.cd.soon .cd-bar i{background:var(--orange)}
.cd.over .cd-t{color:var(--red)}.cd.over .cd-bar i{background:var(--red)}
.cd .cd-s{font-size:11.5px;color:var(--text-3)}

/* ---------- การ์ดงานผู้รับเหมา (ตามภาพตัวอย่างที่ 1) ---------- */
.job-feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.job{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.job .jh{display:flex;justify-content:space-between;gap:12px;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.job .jid{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;font-size:14px;color:var(--ink)}
.job .jmeta{font-size:12.5px;color:var(--text-3);margin-top:3px}
.job .ref{flex:none;text-align:right;background:var(--green-bg);border:1px solid #BADFC8;border-radius:10px;padding:6px 10px;align-self:flex-start}
.job .ref .k{font-size:12px;color:var(--green);display:flex;gap:4px;align-items:center;justify-content:flex-end}
.job .ref .v{font-size:18px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;white-space:nowrap}
.job .ref .s{font-size:11.5px;color:var(--green);opacity:.85}
.job .jb{padding:12px 16px;flex:1}
.job .jb h3{margin-bottom:6px;font-size:16px}
.job .ln{display:flex;gap:7px;align-items:flex-start;font-size:13.5px;color:var(--text-2);margin:3px 0}
.job .ln .ico{margin-top:2px;color:var(--text-3)}
.job .draw{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.job .jf{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.job.expired{opacity:.72}
.drawbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--action);cursor:pointer}
.drawbtn:hover{background:var(--action-bg)}
.drawbtn.prod{color:var(--teal)}.drawbtn.prod:hover{background:var(--teal-bg)}

/* ---------- ผู้รับเหมา: แถบแท็บล่าง (มือถือ) ---------- */
.ctabs{display:none}
.con-hero{background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:16px 18px;margin-bottom:16px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
.con-hero h1{color:#fff;font-size:19px}.con-hero .s{color:#AFC0DA;font-size:13px}
.con-hero .stats{display:flex;gap:18px}
.con-hero .stats div,.con-hero .stats a{text-align:center}.con-hero .stats b{display:block;font-size:20px;color:#fff}.con-hero .stats span{font-size:12px;color:#AFC0DA}
.con-hero .stats a{text-decoration:none;padding:4px 10px;border-radius:10px;border:1px solid transparent}
.con-hero .stats a:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
.con-hero .stats a.on{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25)}
.con-hero .stats a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ---------- ขั้นตอนติดตั้ง (Tab 3) ---------- */
.steps{display:flex;flex-direction:column;gap:0;margin-top:6px}
.stp{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.stp:not(:last-child)::before{content:'';position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.stp .dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line-2);background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--text-3)}
.stp.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.stp.cur .dot{border-color:var(--action);color:var(--action);box-shadow:0 0 0 4px rgba(30,91,168,.12)}
.stp.done:not(:last-child)::before{background:var(--green)}
.stp .sb{padding-top:5px}
.stp .sb h4{margin-bottom:4px}
.stp .box{margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.barcode-ph{display:flex;gap:12px;align-items:center}
.barcode-ph .bc{width:74px;height:46px;border-radius:6px;background:repeating-linear-gradient(90deg,#14233B 0 2px,transparent 2px 4px,#14233B 4px 5px,transparent 5px 8px,#14233B 8px 11px,transparent 11px 12px);opacity:.75;flex:none}
.prog{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:8px}
.upl{display:block;border:2px dashed var(--line-2);border-radius:10px;padding:16px;text-align:center;color:var(--text-3);cursor:pointer;background:#fff}
.upl:hover{border-color:var(--action);color:var(--action)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{width:88px;height:66px;border-radius:8px;border:1px solid var(--line);background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-3);cursor:pointer;position:relative}
.thumb img,.thumb svg{width:100%;height:100%;object-fit:cover}

/* ---------- การเงิน (Tab 4) ---------- */
.pay-hero{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px}
.pay-hero .pv{padding:18px;border-radius:var(--r-lg);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.pay-hero .pv .k{font-size:13.5px;color:var(--text-2)}
.pay-hero .pv .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.2;margin-top:2px}
.pay-hero .pv.main{background:var(--ink);border-color:var(--ink)}
.pay-hero .pv.main .k{color:#AFC0DA}.pay-hero .pv.main .v{color:#fff;font-size:34px}
.pay-hero .pv.left .v{color:var(--orange)}
.pay-next{display:flex;gap:14px;align-items:center;padding:14px 18px;border-radius:var(--r-lg);background:var(--orange-bg);border:1px solid #F2C9A8;margin-top:14px;flex-wrap:wrap}
.pay-next .dd{font-size:20px;font-weight:700;color:var(--orange)}

/* ---------- ปฏิทิน / คิว ---------- */
/* ปฏิทิน Booking แบบแถบต่อเนื่อง */
.calw{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.calw-h{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.calw-h .dw{padding:7px 8px;font-size:12.5px;color:var(--text-3);background:var(--surface-2);border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.calw-h .dw.we{color:var(--red)}
.cw{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:4px;min-height:112px}
.cw .cday{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 7px;min-width:0}
.cw .cday.we{background:#FCFCFD}
.cw .cday.out{background:#F7F8FA}.cw .cday.out .dn{color:var(--line-2)}
.cw .cday.today{background:#F2F7FF}.cw .cday.today .dn{background:var(--action);color:#fff;border-radius:999px;padding:0 7px}
.cw .dn{font-size:12.5px;font-weight:600;color:var(--text-2);display:inline-block}
.cb{position:relative;z-index:1;margin:0 5px;min-width:0;display:flex;flex-direction:column;gap:1px;padding:4px 8px;border:0;border-left:3px solid var(--c);border-radius:6px;background:var(--b);color:var(--c);text-align:left;font:inherit;cursor:pointer}
.cb:hover{box-shadow:inset 0 0 0 1px var(--c)}
.cb:focus-visible{outline:2px solid var(--action);outline-offset:1px}
.cb.cl{margin-left:0;border-left-style:dotted;border-top-left-radius:0;border-bottom-left-radius:0}
.cb.cr{margin-right:0;border-top-right-radius:0;border-bottom-right-radius:0}
.cb1,.cb2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb1{font-size:12.5px;line-height:1.35}
.cb1 b{font-weight:700}
.cb1 i{font-style:normal;font-size:11px;opacity:.8;margin-left:6px}
.cb2{font-size:11.5px;line-height:1.35;color:var(--text-2)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dw{padding:7px 8px;font-size:12.5px;color:var(--text-3);background:var(--surface-2);border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.cal .dw.we{color:var(--red)}
.cal .dc{min-height:104px;padding:5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .dc.out{background:#FAFBFC}.cal .dc.out .dn{color:var(--line-2)}
.cal .dc.today{background:#F5F9FF}.cal .dc.today .dn{background:var(--action);color:#fff;border-radius:999px;padding:0 7px}
.cal .dn{font-size:12.5px;font-weight:600;align-self:flex-start;color:var(--text-2)}
.cal .ev{display:block;font-size:11.5px;line-height:1.35;padding:2px 6px;border-radius:5px;color:var(--c);background:var(--b);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%}
.cal .ev b{font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--text-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.gantt{overflow-x:auto;border-top:1px solid var(--line);--days:28}
.gr{display:flex;min-width:max-content;width:100%;border-bottom:1px solid var(--line)}
.gr .gn{flex:0 0 220px;width:220px;padding:9px 12px;position:sticky;left:0;background:#fff;z-index:3;border-right:1px solid var(--line);font-size:13.5px}
.gr .gn b{display:block;font-size:13.5px;line-height:1.3}
.gr .gn .gs{display:block;font-size:12px;color:var(--text-3);margin-top:2px;line-height:1.35}
.gr .gn .gs.on{color:var(--violet);font-weight:600}
.gr .gt{position:relative;height:58px;flex:1 1 auto;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100% / var(--days)) 100%}
.gantt.d14 .gr .gt{min-width:calc(var(--days) * 52px)}.gantt.d28 .gr .gt{min-width:calc(var(--days) * 30px)}.gantt.d56 .gr .gt{min-width:calc(var(--days) * 17px)}
.gr.head .gt{height:40px;background-color:var(--surface-2)}
.gr.head .gn{background:var(--surface-2);font-weight:600;color:var(--text-2);font-size:12.5px}
.gr.head.gm .gt{height:26px;background-image:none;border-bottom:1px solid var(--line)}
.gr.head.gm{border-bottom:0}
.gmo{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:700;color:var(--ink-text,#1E293B);border-left:2px solid var(--line-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gd{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;line-height:1.15;color:var(--text-2);z-index:1}
.gd b{font-weight:600}
.gd i{font-style:normal;font-size:10px;color:var(--text-3)}
.gd.we b,.gd.we i{color:var(--text-3)}
.gd.now b{background:var(--red);color:#fff;border-radius:999px;padding:0 5px}
.gantt.d56 .gd i{display:none}.gantt.d56 .gd{font-size:10.5px}
.gwe{position:absolute;top:0;bottom:0;background:rgba(15,23,42,.045);pointer-events:none}
.gwant{position:absolute;top:0;bottom:0;background:rgba(37,99,235,.09);border-left:1px dashed rgba(37,99,235,.45);border-right:1px dashed rgba(37,99,235,.45);pointer-events:none}
.gnow{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--red);opacity:.55;z-index:2;pointer-events:none}
.gb{position:absolute;top:6px;height:24px;border-radius:6px;font-size:11.5px;line-height:22px;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:1px solid;z-index:2;box-sizing:border-box}
.gb b{font-weight:700;margin-right:5px;font-variant-numeric:tabular-nums}
.gb span{font-weight:500}
.gantt.d56 .gb span{display:none}
.gb.cl{border-top-left-radius:0;border-bottom-left-radius:0;border-left-style:dashed}
.gb.cr{border-top-right-radius:0;border-bottom-right-radius:0;border-right-style:dashed}
.gb:hover{filter:brightness(.96);box-shadow:0 1px 4px rgba(15,23,42,.15)}
.gb.s-upcoming{background:var(--teal-bg);color:var(--teal);border-color:#8FCFC4}
.gb.s-installing{background:var(--violet);color:#fff;border-color:var(--violet)}
.gb.s-done{background:var(--green-bg);color:var(--green);border-color:#A9D8BC}
.gb.s-check{background:var(--orange-bg);color:var(--orange);border-color:#F0BE95}
.gb.ack{background:#FFF6E6;color:#8A5A0B;border:1px dashed #D98A16}
.gb.s-probe{background:repeating-linear-gradient(135deg,#FFF6F5,#FFF6F5 6px,#FBE1DE 6px,#FBE1DE 12px);color:var(--red);border:2px dashed var(--red);top:32px;height:22px;line-height:18px;font-weight:700;cursor:default}
.gb.s-probeok{background:repeating-linear-gradient(135deg,#F2FAF6,#F2FAF6 6px,#DDF1E6 6px,#DDF1E6 12px);color:var(--green);border:2px dashed var(--green);top:32px;height:22px;line-height:18px;font-weight:700;cursor:default}
.gr.free .gn{box-shadow:inset 3px 0 0 var(--green)}
.gr.clash .gn{box-shadow:inset 3px 0 0 var(--red)}
.gchip{margin-top:3px;line-height:1.5}
.qchip{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:1px 8px 1px 6px;border-radius:999px;vertical-align:middle}
.qchip .ico{width:12px;height:12px}
.qchip.ok{background:var(--green-bg);color:var(--green)}
.qchip.no{background:#FBE1DE;color:var(--red)}
.q-tools{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
@media (max-width:640px){.gr .gn{flex-basis:132px;width:132px;padding:8px 9px}.gr .gn b{font-size:12.5px}.gr .gn .gs{font-size:11px}.gantt.d14 .gr .gt{min-width:calc(var(--days) * 32px)}}

/* ---------- Modal / Drawer / Toast ---------- */
#overlay{position:fixed;inset:0;z-index:300;display:none;container-type:inline-size;container-name:app}
#overlay.on{display:block}
#overlay .bg{position:absolute;inset:0;background:rgba(14,22,36,.45)}
.modal{position:absolute;left:50%;top:6vh;transform:translateX(-50%);width:min(680px,calc(100% - 24px));max-height:88%;display:flex;flex-direction:column;background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.modal.lg{width:min(920px,calc(100% - 24px))}
.modal .mh,.drawer .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mh h2,.drawer .mh h2{display:flex;gap:8px;align-items:center}
.modal .mh .x,.drawer .mh .x{border:0;background:none;cursor:pointer;color:var(--text-3);padding:2px}
.modal .mb,.drawer .mb{padding:18px 20px;overflow-y:auto}
.modal .mf,.drawer .mf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 16px 16px}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(980px,100%);background:#fff;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.2);container-type:inline-size;container-name:drawer;transition:width .18s ease}
.drawer.max{width:100%}
.mh-acts{display:flex;gap:4px;align-items:center;flex:none}
.dw-h{display:none}
@container drawer (min-width:760px){
  .dw-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 28px;align-items:start}
  .dw-side{border-left:1px solid var(--line);padding-left:24px;min-height:100%}
  .dw-side > .divider:first-child{display:none}
  .dw-h{display:block;margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.drawer .mb{flex:1;min-height:0}
.drawer .mf{border-radius:0}
.drawer .mh h2{flex-wrap:wrap}
#toasts{position:fixed;right:16px;bottom:16px;z-index:400;display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:8px;align-items:center;max-width:420px}
.toast.err{background:#7C2620}.toast.ok .ico{color:#7EE2B0}
.paper-doc{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.08);padding:10px}
.paper-doc svg{display:block;width:100%;height:auto}
tr.dim td{opacity:.72}
.sn{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:1px 7px;border-radius:999px;background:#EEF3FA;color:#1E4E8C;font:600 11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;vertical-align:middle;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sn .ico{flex:none}
.jsn{display:flex;align-items:center;gap:4px;font-size:12px;color:#1E4E8C;margin-top:2px}
.sn-card{border-color:#BFD2EC;background:linear-gradient(0deg,#fff,#F5F8FD)}
.sn-card label{font-weight:700;color:var(--ink)}
.sn-in{font-size:18px;height:46px;letter-spacing:.3px}
.sn-wait{margin-top:12px;border:1.5px dashed #C9D6E8;border-radius:10px;padding:10px 12px;background:#fff}
.sn-wait-h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--text-2)}
.sn-wait-b{margin-top:6px;font-size:12.5px;color:var(--text-3);line-height:1.9}
.sn-chip{display:inline-block;margin:0 4px 0 0;padding:0 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--text-2);font-size:12px;line-height:1.7}
.sbox{position:relative;flex:1;max-width:460px;min-width:220px}
.sbox .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.sbox .input{padding-left:34px}
tr.hidden{display:none}
.fv-links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.actbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 12px;margin-bottom:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px}
.actbar .lbl{font-size:12px;color:var(--text-3);margin-right:2px}
.refchg{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#8A5A00;background:#FFF4D6;border:1px solid #F2D58A;border-radius:999px;padding:2px 8px}
.viewer-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;color:var(--text-2);flex-wrap:wrap}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:linear-gradient(160deg,var(--ink) 0%,#223A5E 60%,#2D4B74 100%)}
.login{width:min(400px,100%);background:#fff;border-radius:18px;padding:26px 24px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.login .lg-h{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.login.setup{width:min(520px,100%)}
.lg-mark{width:44px;height:44px;border-radius:12px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.login.reg{width:min(560px,100%)}
.reg-roles{grid-template-columns:repeat(3,minmax(0,1fr))}
.lg-reg{margin-top:14px;justify-content:center}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@container app (max-width:520px){.reg-roles{grid-template-columns:1fr}}
.lg-note{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);line-height:1.5}
.login .acc{display:flex;flex-direction:column;gap:6px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.login .acc button{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 10px;cursor:pointer;font-size:13px}

/* ---------- Responsive (อิงความกว้างแอป รองรับกรอบมือถือ) ---------- */
@container app (max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@container app (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);background:var(--paper)}
  .side{display:none}
  .side.open{display:flex;position:fixed;left:0;top:0;bottom:0;width:270px;height:100vh;z-index:60;box-shadow:12px 0 40px rgba(0,0,0,.3)}
  .mtop{display:flex}
  .content{padding:16px 14px 90px}
  .viewas{padding:8px 14px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .c2,.c3,.c4,.c6,.c8,.c12{grid-column:auto}
  .mat-tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .mat-tile .face{height:58px}
  .mat-tile .lbl{flex-direction:column;gap:0;padding:7px 9px}
  .type-row{grid-template-columns:minmax(0,1fr);gap:8px}
  .type-row .fee{text-align:left}
  .job-feed{grid-template-columns:minmax(0,1fr)}
  .pay-hero{grid-template-columns:minmax(0,1fr)}
  .cw{min-height:70px}.cw .cday{padding:3px}
  .cb{margin:0 2px;padding:2px 4px}.cb1{font-size:10.5px}.cb1 i,.cb2{display:none}
  .cal .dc{min-height:64px;padding:3px}
  .cal .ev{font-size:10.5px;padding:1px 3px}
  .cal .ev .xl{display:none}
  .page-head h1{font-size:20px}
  /* ผู้รับเหมา: แท็บล่าง */
  .con .ctabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:sticky;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(20,35,59,.08);margin:0 -14px -90px;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .con .ctabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;font-size:11.5px;color:var(--text-3);text-decoration:none;position:relative;text-align:center;line-height:1.25}
  .con .ctabs a .ico,.con .ctabs .ct-menu .ico{width:22px;height:22px}
  .con .ctabs .ct-menu{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;font:inherit;font-size:11.5px;color:var(--text-3);background:none;border:0;cursor:pointer;line-height:1.25}
  .con .ctabs a.on{color:var(--action);font-weight:600}
  .con .ctabs a .cnt{position:absolute;top:0;left:calc(50% + 6px);background:var(--orange);color:#fff;border-radius:999px;font-size:10.5px;padding:0 5px;line-height:16px}
  .shell.is-con .mtop{display:none}
  .con-hero{flex-wrap:nowrap;align-items:flex-start}.con-hero>div:first-child{flex:1;min-width:0}.content.con .con-hero .pbell.ch{display:inline-flex}
  .con-hero .stats{display:none}
  .t.resp thead{display:none}
  .t.resp tr{display:block;padding:10px 12px;border-bottom:1px solid var(--line)}
  .t.resp td{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border:0;text-align:right}
  .t.resp td::before{content:attr(data-l);color:var(--text-3);font-size:12.5px;text-align:left;flex:none}
  .t.resp td.main{display:block;text-align:left;padding-bottom:6px}
  .t.resp td.main::before{display:none}
  .modal{top:auto;bottom:0;left:0;transform:none;width:100%;max-height:92%;border-radius:18px 18px 0 0}
  .modal .mf{border-radius:0}
  .modal .mf .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.side,.mtop,.ctabs,#toasts{display:none!important}.shell{display:block;background:#fff}}

/* ---------- V6: ส่วนที่เพิ่มสำหรับระบบจริง ---------- */
.scrim{position:absolute;inset:0;z-index:55;background:rgba(0,0,0,.3)}
.tl-row{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.todo{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.todo:hover{background:var(--surface-2);text-decoration:none}
.todo .ti{width:32px;height:32px;justify-content:center;padding:0}
.thumb{position:relative}
.thumb .tcat{position:absolute;left:3px;bottom:3px;background:rgba(20,35,59,.82);color:#fff;font-size:10.5px;border-radius:4px;padding:0 5px;line-height:16px}
.thumb .tdel{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:22px;height:22px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:pointer;line-height:1;font-size:15px;color:var(--red)}
.thumb .tf{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text-3)}
.pdfv{width:100%;height:62vh;border:1px solid var(--line);border-radius:8px;background:#fff}
.fview .paper-doc img{max-height:70vh;object-fit:contain}
.addon .addon-btn{border:1px solid var(--line-2);border-left:0;border-radius:0 var(--r-sm) var(--r-sm) 0;background:var(--surface-2);padding:0 12px;cursor:pointer;font-size:13px;color:var(--action);font-weight:600}
.pay-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pay-opt{position:relative;display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;background:#fff}
.pay-opt input{position:absolute;opacity:0;pointer-events:none}
.pay-opt .po-dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);margin-top:2px;background:#fff}
.pay-opt b{display:block;font-size:15px;color:var(--ink)}
.pay-opt .xs{display:block;color:var(--text-3);line-height:1.4}
.pay-opt .po-hint{color:var(--violet);font-weight:600;margin-top:3px}
.pay-opt.on{border-color:var(--action);box-shadow:0 0 0 3px rgba(30,91,168,.12)}
.pay-opt.on .po-dot{border-color:var(--action);background:radial-gradient(circle,var(--action) 0 4px,#fff 5px)}
.pay-opt:focus-within{outline:2px solid var(--action);outline-offset:2px}
.field.invalid .pay-opt{border-color:#E9A39C}
.ex-opts{display:flex;flex-direction:column;gap:8px}
.pay-next.ok{background:var(--green-bg);border-color:#BADFC8}
@container app (max-width:860px){
  .pay-opts{grid-template-columns:minmax(0,1fr)}
  .tl-row{grid-template-columns:96px 1fr}
  .scrim{position:fixed}
}
@media (max-width:600px){#toasts{top:10px;bottom:auto;left:10px;right:10px;max-width:none}.toast{max-width:none}}

/* V7.6 · ข้อมูลจาก StarNexus ผ่าน Production Nexus (ฟอร์ม Sale) */
.snb{margin-top:12px;border:1.5px solid #B9D7C4;border-radius:10px;background:#fff;overflow:hidden}
.snb-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px;font-size:13px;font-weight:700;color:var(--text-2);background:#F3FAF5;border-bottom:1px solid #DCEDE2}

.snb-list{display:flex;flex-direction:column;gap:6px}
.snb-it{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);cursor:pointer;font:inherit;color:var(--ink)}
.snb-it:hover,.snb-it:focus-visible{border-color:var(--action);background:#F2F7FF}
.snb-it .mono{font-size:13px}
.snb-cur{margin-top:8px;width:auto}

.snb-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}

.snb-dl{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;margin:8px 0;font-size:13px}
.snb-dl dt{color:var(--text-3)}.snb-dl dd{margin:0;min-width:0;overflow-wrap:anywhere}

.snb-fill{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.snb-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:4px 0;font-size:13px;cursor:pointer}
.snb-row input{margin:0;transform:translateY(2px)}
.snb-l{min-width:150px;color:var(--text-2)}
.snb-v{font-weight:600;color:var(--ink);overflow-wrap:anywhere}.snb-v.url{font-weight:500;font-size:12.5px}
.snb-ok{color:var(--green);display:inline-flex;align-items:center;gap:4px}
.snb-btns{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
@media (max-width:640px){.snb-dl{grid-template-columns:1fr}.snb-dl dt{margin-top:4px}.snb-l{min-width:0;width:100%}}
.pdf-ext{display:flex;align-items:center;gap:12px;padding:18px;border:1px dashed var(--line);border-radius:10px;background:var(--surface-2);color:var(--text-2)}

.side .foot .nx-nav:empty{display:none}
/* V7.9.2: ลิงก์สำหรับผู้รับเหมา — แถบ "คุณกำลังดูหน้าจอผู้รับเหมา" (มุมขวาบนของหน้าผู้รับเหมา) */

.viewas .cn-link .cl-u:focus{outline:2px solid var(--action);outline-offset:1px}

/* V7.9: อ่านข้อมูลลูกค้าจากแบบงาน (ฟอร์ม Sale) */
.drb{border:1.5px solid #B9D7C4;border-radius:10px;background:#F7FBF8;padding:10px 12px}
.drb-h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:6px}
.drb-dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 10px;margin:4px 0 6px;font-size:13px}
.drb-dl dt{color:var(--text-3)}.drb-dl dd{margin:0;min-width:0;overflow-wrap:anywhere;color:var(--ink);font-weight:600}
.drb-dl dd .btn{margin-left:4px;font-weight:500}
.drb-ok{display:inline-flex;align-items:center;gap:3px;color:var(--green);font-size:12px;font-weight:500}
.drb-raw{margin-top:8px;font-size:12.5px}.drb-raw summary{cursor:pointer;color:var(--action)}
.drb-raw pre{margin:4px 0 0;max-height:220px;overflow:auto;white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;line-height:1.5}
.drb .spin{width:14px;height:14px;border:2px solid #BADFC8;border-top-color:var(--green);border-radius:50%;animation:drspin .8s linear infinite}
@keyframes drspin{to{transform:rotate(360deg)}}
.field.dr-auto > label::after{content:'จากแบบงาน';margin-left:6px;padding:0 6px;border-radius:999px;background:var(--green-bg);color:var(--green);font-size:11px;font-weight:600;vertical-align:1px}
.field.dr-auto .input,.field.dr-auto .select{border-color:#9FD3B4;background:#F7FBF8}
@container app (max-width:640px){.drb-dl{grid-template-columns:minmax(0,1fr)}.drb-dl dt{margin-top:4px}}
/* V7.9: มือถือ / แท็บเล็ต */
.ctabs .ct-menu{display:none}
@container app (max-width:520px){.gr .gn{flex-basis:136px;width:136px;padding:8px 10px}.gr .gn b{font-size:12.5px}}

  /* ช่องกรอกตัวอักษร 16px — iPhone ไม่ซูมหน้าเองตอนแตะช่อง */

.side .brand .nx-home{margin-left:auto;flex:none;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#DCE4F0;cursor:pointer;padding:0}

.map-in{display:flex;gap:8px;align-items:center}.map-in .input{flex:1;min-width:0}.map-in .btn{white-space:nowrap}

.map-ok{margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.field.sn-auto .input{border-color:#9DBCE8;background:#F5F9FF}

.map-nav{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}

/* V7.10.3: ไฟล์แบบงานที่แนบแล้ว — เห็นชัดว่าแนบสำเร็จ */
.upl .upl-t2{display:none}

.sf-busy .spin{width:15px;height:15px;border:2px solid #C9D9F6;border-top-color:#2563C9;border-radius:50%;animation:drspin .8s linear infinite;flex:none}
.sf-ok{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;padding:9px 12px;border-radius:9px;background:var(--green-bg);border:1px solid #9FD3B4;color:#1B5A37;font-size:14px;font-weight:700}

/* V7.12: แถวชื่อโปรแกรม — ปุ่มย้อนกลับ + รูปบ้าน ไม่ดันชื่อโปรแกรมตกบรรทัด */
.side .brand{gap:8px}

.alertbar{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;margin:0 0 12px;border:1px solid #EDCB8E;border-left:4px solid #D98A16;border-radius:var(--r);background:#FFF6E6;color:#5C3B05;font-size:14px}

.alertbar .ab-d{font-size:13.5px;margin-top:2px;line-height:1.55}
.alertbar .ab-red{color:var(--red)}
.alertbar .ab-go{flex:none;align-self:center;background:#fff}
.alertbar.red{border-color:#EBB0AA;border-left-color:var(--red);background:#FDF0EE;color:#6E201A}
.alertbar.red > .ico{color:var(--red)}
.alertbar.info{border-color:#C3D5EF;border-left-color:var(--action);background:var(--blue-bg);color:#1E3F6D}
.alertbar.info > .ico{color:var(--action)}
.t tr.need > td:first-child{box-shadow:inset 4px 0 0 #E09B2D}
.t tr.need.over > td:first-child{box-shadow:inset 4px 0 0 var(--red)}
.t tr.need{background:#FFFBF2}
@media (max-width:760px){.alertbar{flex-wrap:wrap}.alertbar .ab-go{margin-left:28px}.t.resp tr.need{box-shadow:inset 4px 0 0 #E09B2D}.t.resp tr.need > td:first-child{box-shadow:none}}
/* ===================== V7.13 คลังสินค้า ===================== */
.wh-step{margin-bottom:12px}

.wh-step.off .ws-n{background:var(--line-2)}
.wh-scan{margin-top:8px}
.wh-scan .ws-row{display:flex;gap:8px;margin-top:4px}
.wh-scan .ws-row .input{flex:1;min-width:0;height:48px;font-size:18px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.02em;text-transform:uppercase;border-width:2px}

.loc-chip span{color:var(--text-3)}
.loc-chip.p{border-color:#9FD5CB}.loc-chip.h{border-color:#E8C27A;background:var(--amber-bg)}.loc-chip.f{border-color:#E7A39D;background:var(--red-bg)}.loc-chip.x{opacity:.6}
span.loc-chip{cursor:default}
.wh-log{max-height:300px;overflow:auto}
.wh-log .wl{display:flex;gap:10px;align-items:flex-start;padding:8px 18px;border-bottom:1px solid var(--line)}

.wh-log .wl.ok > .ico{color:var(--green)}.wh-log .wl.w{background:#FFFBF2}.wh-log .wl.w > .ico{color:var(--amber)}
.wh-log .wl.no{background:var(--red-bg)}.wh-log .wl.no > .ico{color:var(--red)}
/* V7.16: ผลยิงรับที่หน้างาน */
#pk-msg.wl{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;border-radius:8px;background:var(--green-bg,#EEF7F1);border:1px solid #C3E3CF}
#pk-msg.wl > div{flex:1;min-width:0;word-break:break-word}#pk-msg.wl > .ico{color:var(--green);margin-top:2px}
#pk-msg.wl.w{background:#FFFBF2;border-color:#EBD3A0}#pk-msg.wl.w > .ico{color:var(--amber)}
#pk-msg.wl.no{background:var(--red-bg);border-color:#F1C2BC}#pk-msg.wl.no > .ico{color:var(--red)}
.pick{display:grid;gap:10px}
.pick .pk{display:flex;gap:12px;align-items:flex-start;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.pick .pk:last-child{border-bottom:0;padding-bottom:0}
.pick .pk-h{flex:none;min-width:120px}
.pick .pk-c{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px}

/* ผังชั้นวาง: 1 ช่อง = 1 โลเคชั่น · แถบสีในช่องสูงตามปริมาณห่อ */
.wh-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 10px;color:var(--text-2)}
.wh-legend span{display:inline-flex;align-items:center;gap:6px}
.wh-legend i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line-2);background:#fff}
.wh-legend i.p{background:#BFE6DE}.wh-legend i.h{background:#F5D79A}.wh-legend i.f{background:#F1AFA8}.wh-legend i.x{background:repeating-linear-gradient(45deg,#EDF0F4 0 4px,#fff 4px 8px)}
.wh-zone{margin-bottom:14px}
.wz-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.wz{display:grid;gap:6px;min-width:max-content}

.wz-r{justify-content:center}

.wz-c.h > i{background:#F5D79A}.wz-c.f > i{background:#F1AFA8}.wz-c.f{border-color:#E7A39D}

.wz-c .hl-n{position:absolute;top:4px;right:4px;z-index:2;font-style:normal;min-width:18px;height:18px;border-radius:9px;background:var(--action);color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 5px}
.wz-c.hl .hl-n{display:inline-flex}
.cam-ok{color:var(--ok,#1F7A4D)}.cam-w{color:var(--warn-ink,#8A6420)}.cam-no{color:var(--red,#B42318)}
.cam-box{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:4/3;max-height:60vh}

@media (max-width:640px){.hide-sm{display:none}.wh-step > .card-b{gap:10px}.wh-step .ws-n{width:26px;height:26px;font-size:13px}.wh-scan .ws-row .input{font-size:16px}.wh-scan .ws-row{flex-wrap:wrap}.wh-scan .ws-row .input{flex:1 1 100%}.wh-scan .ws-row .btn.primary{flex:1}.wh-scan .ws-row .btn:not(.primary){width:56px;justify-content:center}.pick .pk{flex-direction:column;gap:6px}.wh-big .v{font-size:28px}}

/* V7.15: กล่องรับแจ้งเตือนในมือถือ (หน้าแรกผู้รับเหมา / หัวหน้าช่างโรงงาน) */
.pushadm{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:13.5px}.pushadm input{margin-top:3px;width:18px;height:18px;flex:none}.pushadm > span{display:flex;flex-direction:column;gap:2px}
/* V7.16.5: แถบติดตั้งแอป (มือถือ · ยังไม่ติดตั้ง) */
.instbar{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:10px 10px 10px 14px;border-radius:var(--r-lg);background:var(--ink);color:#fff;box-shadow:var(--shadow)}
.instbar>svg{flex:none;color:#E9C77B}
.instbar .ib-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;line-height:1.35}
.instbar .ib-t b{font-size:14px}.instbar .ib-t span{font-size:12px;color:#C9D3E1}
.instbar .btn{flex:none;white-space:nowrap;min-height:38px}
.instbar .ib-x{flex:none;width:36px;height:36px;border:0;border-radius:9px;background:rgba(255,255,255,.08);color:#C9D3E1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}

.pbell{position:relative;flex:none;width:38px;height:38px;border-radius:10px;border:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(255,255,255,.08);color:#fff}
.pbell i{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:#8C99AB;box-shadow:0 0 0 2px var(--ink)}
.pbell.on i{background:#3CC37A}
.mtop .pbell{padding:0}
.side .who .pbell{margin-left:auto;width:34px;height:34px}
.con-hero .pbell.ch{display:none;width:40px;height:40px}

.ps-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ps-row:last-child{border-bottom:0}

.ps-steps{margin:4px 0 10px;padding-left:22px;font-size:14px;line-height:1.85}
.ps-hint{display:flex;gap:8px;align-items:flex-start;margin:2px 0 8px;padding:9px 11px;border-radius:10px;background:#F2F6FC;color:var(--text-2);font-size:13px;line-height:1.5}.ps-hint svg{flex:none;margin-top:2px;color:var(--action)}
.instbar a.btn,a.btn[data-chrome]{text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.sw-t{flex:none;position:relative;width:52px;height:30px;border-radius:15px;border:0;background:#C5CDD8;cursor:pointer;transition:background .15s}

.pushcard{display:flex;gap:12px;align-items:flex-start;border:1px solid #EBD3A0;background:#FFF8EA;border-radius:12px;padding:12px 14px;margin:0 0 14px;color:var(--ink-text)}

/* V7.16.2: ปุ่มกลับหน้า Admin (Admin ดูหน้าจอแผนกอื่น) — ข้างปุ่มย้อนกลับที่แถบซ้าย + แถบบนมือถือ */
.nx-adm{flex:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;border-radius:9px;border:1px solid rgba(232,184,92,.45);background:rgba(232,184,92,.14);color:#F3D9A4}

.ack-card{border-color:#EDCB8E;box-shadow:0 0 0 3px #FFF6E6}

.side .brand:has(.nx-adm) > div > span{display:none}

#tipbox{position:fixed;z-index:1000;left:0;top:0;max-width:300px;padding:8px 11px;border-radius:8px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:400;line-height:1.55;white-space:pre-line;text-align:left;box-shadow:0 8px 24px rgba(15,23,42,.28);pointer-events:none;opacity:0;visibility:hidden;transform:translateY(3px);transition:opacity .12s,transform .12s}

.pk-list{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}

.pk-r{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:13.5px;min-height:38px}

      const r = await snbCall('orders', { q: v, limit: 8 });

  });
  if (!done.length) return;

function whMissGuess(codes, need) {

  if (ks.length === 1) { const k = ks[0]; for (let i = Math.max.apply(null, Object.keys(g[k].n).map(Number)) + 1; out.length < need; i++) out.push(nm(k, i)); }

async function whIssOne(code) {
  const o = DB.orders.find((x) => x.id === WH.iorder);

  const p = whData().packs.find((x) => x.code === code);
  if (p && p.order !== o.id) { whLogAdd(WH.ilog, false, code, 'เป็นของ Order ' + p.order + ' ไม่ใช่ ' + o.id + ' — อย่าขึ้นรถคันนี้'); whPaint(); return; }

  try {
    const r = await rpc('cn_wh_issue', { p_order: o.id, p_code: code });
    whApply(o.id, () => { const x = whData().packs.find((y) => y.code === r.code); if (x) { x.st = 'out'; x.outAt = new Date(nowMs()).toISOString(); x.outBy = S.user.name; } });

/* ---------- V7.15: ติดตั้งเป็นแอปบนมือถือ + แจ้งเตือนผ่านแอป (Web Push · ฟรี) + เลขบนไอคอนแอป ----------
   ใช้ได้เฉพาะเปิดจากลิงก์ (GitHub Pages / https) ตรง ๆ — ในแท็บของ Production (กรอบ) ไม่เปิดส่วนนี้
   ไฟล์คู่กันในโฟลเดอร์เดียวกับ index.html: manifest.webmanifest · sw.js · icons/ (ไม่มีไฟล์ = ส่วนนี้ไม่ทำงาน ส่วนอื่นใช้ได้ตามเดิม)
   เปิดการแจ้งเตือน = ขออนุญาต → ขอกุญแจสาธารณะจาก Edge Function cn-push → สมัครกับบริการแจ้งเตือนของมือถือ → บันทึกเครื่อง (cn_push_subscribe)
   ผู้รับเหมา: งานใหม่ · ใกล้หมดเวลาเสนอราคา · ได้รับอนุมัติ / ปิดรับราคา · เปลี่ยนวันติดตั้ง · ใบส่งมอบต้องแก้ · บันทึกจ่ายเงิน · ยกเลิก
   หัวหน้าช่างโรงงาน: งานใหม่รอจัดทีม · พรุ่งนี้มีงานติดตั้ง · ย้ายไปผู้รับเหมา / ยกเลิก
   V7.16.5: จัดซื้อ: Order ใหม่รอเลือกช่องทาง · หมดเวลาเสนอราคา · ผู้รับเหมาไม่รับเงื่อนไข (sql/06_push_pur.sql)
            แถบ “ติดตั้งแอปลงหน้าจอ” ทุกหน้าบนมือถือ · กระดิ่งมุมขวาบน = เปิด / ปิดแจ้งเตือน + เสียง + ส่งทดสอบ ในแอปเลย */
const PUSH = { reg: null, sub: null, perm: 'default', inst: null, busy: false, linked: '', tick: 0, ready: false, sound: true, info: null, infoAt: 0, infoBusy: false };
const PUSH_ROLES = { contractor: 1, installer: 1, purchasing: 1, sale: 1, admin: 1 };   /* V7.16.5: + จัดซื้อ / Sale (เลือกหัวข้อได้) */   /* V7.16: Admin รับแจ้งเตือนทุกขั้นตอน (เปิดที่ ตั้งค่าระบบ) */
function pwaTop() { try { return !FRAMED && window.top === window && window.isSecureContext && 'serviceWorker' in navigator; } catch (e) { return false; } }
function pushCapable() { return pwaTop() && 'PushManager' in window && 'Notification' in window; }
function pwaStandalone() { try { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } }
function pwaIOS() { return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function pushUA() { const u = navigator.userAgent; return (pwaIOS() ? 'iPhone/iPad' : /Android/.test(u) ? 'Android' : 'คอมพิวเตอร์') + (pwaStandalone() ? ' · แอป' : ' · เบราว์เซอร์'); }
function b64uBytes(s) { const t = String(s).replace(/-/g, '+').replace(/_/g, '/'); const bin = atob(t + '==='.slice((t.length + 3) % 4)); const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
function sameKey(sub, key) { try { const a = new Uint8Array(sub.options.applicationServerKey); return a.length === key.length && a.every((v, i) => v === key[i]); } catch (e) { return false; } }

(function pwaInit() {
  if (!pwaTop()) return;
  const add = (tag, at) => { const e = document.createElement(tag); Object.keys(at).forEach((k) => e.setAttribute(k, at[k])); document.head.appendChild(e); };
  if (!document.querySelector('link[rel="manifest"]')) add('link', { rel: 'manifest', href: 'manifest.webmanifest' });
  add('link', { rel: 'apple-touch-icon', href: 'icons/apple-touch-icon.png' });
  add('meta', { name: 'apple-mobile-web-app-capable', content: 'yes' });
  add('meta', { name: 'mobile-web-app-capable', content: 'yes' });
  add('meta', { name: 'apple-mobile-web-app-title', content: 'CN ติดตั้ง' });
  if (!document.querySelector('meta[name="theme-color"]')) add('meta', { name: 'theme-color', content: '#14233B' });
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); PUSH.inst = e; pushCardRefresh(); });
  window.addEventListener('appinstalled', () => { PUSH.inst = null; pushCardRefresh(); });
  navigator.serviceWorker.addEventListener('message', (e) => { const d = e.data || {}; if (d.type === 'cn-nav' && typeof d.hash === 'string' && d.hash.charAt(0) === '#') location.hash = d.hash; });
  navigator.serviceWorker.register('sw.js', { scope: './' }).then(async (reg) => { PUSH.reg = reg; await soundLoad(); PUSH.ready = true; return pushSync(); }).catch(() => { PUSH.ready = true; pushCardRefresh(); });
})();

/* V7.16: เสียงแจ้งเตือน = เสียงมาตรฐานของเครื่อง · เปิด / ปิดแยกทีละเครื่อง (ค่าเริ่มต้น = มีเสียง)
   เก็บในที่เก็บของแอปในเครื่อง (Cache Storage) — ตัวรับแจ้งเตือน (sw.js) อ่านค่าเดียวกันตอนแอปปิดอยู่ */
function soundKey() { return (PUSH.reg ? PUSH.reg.scope : location.href.split('#')[0].replace(/[^/]*$/, '')) + 'cn-sound'; }
async function soundLoad() { try { const r = await (await caches.open('cn-cfg')).match(soundKey()); PUSH.sound = !r || (await r.text()) !== '0'; } catch (e) { PUSH.sound = true; } }
async function soundSave(v) { PUSH.sound = !!v; try { await (await caches.open('cn-cfg')).put(soundKey(), new Response(v ? '1' : '0')); } catch (e) { /* เครื่องไม่ให้เก็บ = มีเสียงตามค่าเริ่มต้น */ } }

/* สถานะในเครื่อง + ผูกเครื่องกับผู้ใช้ที่ล็อกอินอยู่ (เปลี่ยนบัญชี / ล็อกอินใหม่ = ผูกให้เองเมื่อเคยอนุญาตแล้ว) */
async function pushSync() {
  if (!PUSH.reg || !pushCapable()) { pushCardRefresh(); return; }
  try {
    PUSH.perm = Notification.permission;
    PUSH.sub = await PUSH.reg.pushManager.getSubscription();
    const u = S.user;
    if (PUSH.sub && PUSH.perm === 'granted' && u && PUSH_ROLES[u.role] && PUSH.linked !== u.id && AUTH.s) {
      await rpc('cn_push_subscribe', { p_sub: PUSH.sub.toJSON(), p_ua: pushUA() });
      PUSH.linked = u.id;
    }
  } catch (e) { /* ไม่ขวางการใช้งาน */ }
  pushCardRefresh(); pushBadge();
  if (pushWanted()) pushAuto();   /* V7.16.6: เปิดสิทธิ์จากตั้งค่ามือถือแล้วโหลดหน้าใหม่ → เปิดให้เอง */
}
const pushOnFor = () => !!(PUSH.sub && PUSH.perm === 'granted' && S.user && PUSH.linked === S.user.id);

  if (!ad) return;
  ad.innerHTML = 'adminAll' in d
    ? '<label class="pushadm"><input type="checkbox" data-chg="pushAdmAll"' + (d.adminAll ? ' checked' : '') + '><span><b>ส่งแจ้งเตือนทุกขั้นตอนให้ Admin</b>' +
      '<span class="xs muted">สำเนาทุกข้อความที่ส่งถึงผู้รับเหมา / หัวหน้าช่าง (บอกว่าส่งถึงใคร) + Sale ยืนยัน Order · ผู้รับเหมาเสนอราคา · หมดเวลาเสนอราคา · เข้าหน้างาน / ติดตั้งเสร็จ · ส่งใบส่งมอบ · บัญชีตรวจรับ · ช่างโรงงานจัดทีม / เริ่ม / เสร็จ / แนบใบส่งมอบ · ยกเลิก Order — ส่งเฉพาะเครื่องของ Admin</span></span></label>'
    : '<div class="small" style="color:var(--warn-ink,#8A6420)">⚠ ยังไม่ได้รัน SQL V7.16 — Admin ยังไม่ได้รับแจ้งเตือนทุกขั้นตอน</div>';
}
on('pushInfo', () => pushInfoFill(true));
on('pushAdmAll', async (el) => {
  const v = !!el.checked; el.disabled = true;
  try {
    await rpc('cn_push_admin_set', { p_on: v });
    if (PUSH.info) PUSH.info.adminAll = v;
    toast(v ? 'เปิดแล้ว — Admin ได้แจ้งเตือนทุกขั้นตอน' : 'ปิดแล้ว — Admin ไม่ได้รับแจ้งเตือนทุกขั้นตอน (ผู้รับเหมา / หัวหน้าช่างยังได้ตามปกติ)');
  } catch (e) { el.checked = !v; toast('บันทึกไม่สำเร็จ: ' + ((e && e.message) || e), 'err'); }
  finally { el.disabled = false; }
});

})();

</script>
</body>
</html>
