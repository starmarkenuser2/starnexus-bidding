function tag(text, tone) { return '<span class="badge plain t-' + (tone || 'gray') + '">' + esc(text) + '</span>'; }
function emptyState(o) {
  return '<div class="empty ' + (o.error ? 'error' : '') + '"><div class="e-ico">' + icon(o.icon || (o.error ? 'alert' : 'info')) + '</div><h3>' + esc(o.title) + '</h3>' +
    (o.text ? '<p>' + o.text + '</p>' : '') + (o.action || '') + '</div>';
}
function notice(type, html, ico) { return '<div class="notice ' + type + '">' + icon(ico || ({ info: 'info', warn: 'alert', danger: 'alert', success: 'checkCircle', secret: 'lock' }[type])) + '<div>' + html + '</div></div>'; }
function countdownHtml(closeAt, status) {
  const ms = Date.parse(closeAt) - Date.now();
  const cls = ms <= 0 ? 'over' : status === 'closing' ? 'soon' : 'ok';
  return '<span class="countdown ' + cls + '" data-countdown="' + esc(closeAt) + '">' + (ms <= 0 ? 'หมดเวลา' : 'เหลือ ' + fmtRemaining(ms)) + '</span>';
}

/* ---------- Toast ---------- */
function toast(msg, type, ms) {
  type = type || 'success';
  const root = document.getElementById('toast-root'); if (!root) return;
  const el = document.createElement('div');
  el.className = 'toast ' + type; el.setAttribute('role', type === 'error' ? 'alert' : 'status');
  el.innerHTML = icon({ success: 'checkCircle', error: 'alert', warning: 'alert', info: 'info' }[type] || 'info') + '<div>' + esc(msg) + '</div><button class="x" type="button" aria-label="ปิดข้อความ">×</button>';
  root.appendChild(el);
  const remove = () => { if (el.parentNode) el.remove(); };
  el.querySelector('.x').addEventListener('click', remove);
  setTimeout(remove, ms || (type === 'error' ? 6500 : 3800));
  while (root.children.length > 4) root.firstChild.remove();
}
function handleError(err) {
  if (!err) return;
  if (err instanceof AppError) {
    const t = err.code === 'forbidden' ? 'error' : err.code === 'validation' ? 'warning' : 'error';
    toast(err.message, t);
  } else {
    console.error(err);
    toast('เกิดข้อผิดพลาด: ' + (err.message || err), 'error');
  }
}

const Modal = {
  stack: [],
  open(o) {
    const ov = document.createElement('div');

    ov.innerHTML = '<div class="modal ' + (o.size || '') + '" role="dialog" aria-modal="true" aria-label="' + esc(o.titleText || '') + '">' +
      '<div class="modal-h"><div><h3>' + (o.title || '') + '</h3>' + (o.sub ? '<div class="sub">' + o.sub + '</div>' : '') + '</div>' +
      '<button class="btn icon sm ghost" type="button" data-close aria-label="ปิดหน้าต่าง">' + icon('x') + '</button></div>' +
      '<div class="modal-b">' + (o.body || '') + '</div>' + (o.footer ? '<div class="modal-f">' + o.footer + '</div>' : '') + '</div>';
    document.getElementById('modal-root').appendChild(ov);
    const entry = { ov, onClose: o.onClose };
    this.stack.push(entry);
    ov.addEventListener('mousedown', (e) => { if (e.target === ov && !o.static) this.close(entry); });
    ov.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => this.close(entry)));
    document.body.style.overflow = 'hidden';
    setTimeout(() => { const f = ov.querySelector('[autofocus]') || ov.querySelector('.modal-b input:not([type=checkbox]):not([type=radio]):not([readonly]), .modal-b textarea, .modal-b select'); if (f && window.innerWidth > 760) f.focus(); }, 40);
    return { el: ov.querySelector('.modal'), close: () => this.close(entry), entry };
  },
  close(entry) {
    entry = entry || this.stack[this.stack.length - 1];
    const i = this.stack.indexOf(entry); if (i < 0) return;
    this.stack.splice(i, 1); entry.ov.remove();
    if (!this.stack.length) document.body.style.overflow = '';
    if (entry.onClose) entry.onClose();
  },
  closeAll() { while (this.stack.length) this.close(); },
  get isOpen() { return this.stack.length > 0; },
};

/* confirmDialog: คืนค่า Promise<{ok:true, value}> หรือ false */
function confirmDialog(o) {
  return new Promise((resolve) => {
    let done = false;
    const tone = o.tone || 'primary';
    const toneIco = { danger: ['t-red', 'alert'], warn: ['t-orange', 'alert'], success: ['t-green', 'checkCircle'], primary: ['t-blue', 'info'] }[tone] || ['t-blue', 'info'];
    const inp = o.input;
    let inputHtml = '';
    if (inp) {
      const common = 'id="cd-input" name="cdInput" ' + (inp.placeholder ? 'placeholder="' + esc(inp.placeholder) + '"' : '');
      inputHtml = '<div class="field" data-field="cdInput" style="margin-top:14px"><label for="cd-input">' + esc(inp.label) + (inp.required ? '<span class="req">*</span>' : '') + '</label>' +
        (inp.type === 'textarea' ? '<textarea class="textarea" ' + common + ' rows="3">' + esc(inp.value || '') + '</textarea>'
          : '<input class="input" type="' + (inp.type || 'text') + '" ' + common + ' value="' + esc(inp.value || '') + '">') +
        (inp.help ? '<div class="help">' + inp.help + '</div>' : '') + '<div class="field-error"></div></div>';
    }
    const m = Modal.open({
      title: esc(o.title), titleText: o.title, size: o.size || 'sm', static: !!inp,
      body: '<div class="confirm-ico ' + toneIco[0] + '">' + icon(o.icon || toneIco[1], 'lg') + '</div>' +
        '<div class="text-2" style="font-size:14.5px">' + (o.html || esc(o.message || '')) + '</div>' + (o.details || '') + inputHtml,
      footer: '<button class="btn" type="button" data-close>' + esc(o.cancelText || 'ยกเลิก') + '</button>' +
        '<button class="btn ' + (tone === 'primary' ? 'primary' : tone) + '" type="button" data-cd-ok>' + esc(o.confirmText || 'ยืนยัน') + '</button>',
      onClose: () => { if (!done) { done = true; resolve(false); } },
    });
    m.el.querySelector('[data-cd-ok]').addEventListener('click', () => {
      let value = null;
      if (inp) {
        const el = m.el.querySelector('#cd-input'), f = el.closest('.field');
        value = el.value.trim();
        let err = '';
        if (inp.required && !value) err = 'กรุณากรอกข้อมูล';
        else if (inp.minLength && value.length < inp.minLength) err = 'อย่างน้อย ' + inp.minLength + ' ตัวอักษร';
        else if (inp.validate) err = inp.validate(value) || '';
        if (err) { f.classList.add('invalid'); f.querySelector('.field-error').textContent = err; el.focus(); return; }
      }
      done = true; m.close(); resolve({ ok: true, value });
    });
  });
}

/* บีบอัดรูปก่อนเก็บ (LocalStorage มีพื้นที่จำกัด) */
function readFileForAttachment(file) {
  return new Promise((resolve) => {
    const base = { id: 'AT-' + randomToken(8), name: file.name, mime: file.type || 'application/octet-stream', size: file.size, kind: 'file', visibility: 'contractor', uploadedAt: nowIso(),
      category: /^image\//.test(file.type) ? 'รูปภาพหน้างาน' : /boq|\.xlsx?$|\.csv$/i.test(file.name) ? 'BOQ' : /\.(pdf|dwg|dxf)$/i.test(file.name) ? 'แบบติดตั้ง' : 'เอกสารอื่น ๆ' };
    const fr = new FileReader();
    if (/^image\/(png|jpe?g|webp|gif|bmp)$/.test(file.type)) {
      fr.onload = () => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
          const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
          const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
          let q = 0.78, url = c.toDataURL('image/jpeg', q);
          while (url.length > 420000 && q > 0.35) { q -= 0.12; url = c.toDataURL('image/jpeg', q); }
          resolve(Object.assign(base, { mime: 'image/jpeg', dataUrl: url, stored: true, size: Math.round(url.length * 0.75) }));
        };
        img.onerror = () => resolve(Object.assign(base, { stored: false }));
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    } else if (file.size <= 300 * 1024) {
      fr.onload = () => resolve(Object.assign(base, { dataUrl: fr.result, stored: true }));
      fr.onerror = () => resolve(Object.assign(base, { stored: false }));
      fr.readAsDataURL(file);
    } else {
      resolve(Object.assign(base, { stored: false }));
    }
  });
}

/* ---------- Router ---------- */
const ROUTES = [];
function route(pattern, view) { ROUTES.push({ pattern, view }); }
function parseHash() {
  const h = location.hash.replace(/^#/, '') || '/dashboard';
  const [path, qs] = h.split('?');
  return { path, parts: path.split('/').filter(Boolean), query: Object.fromEntries(new URLSearchParams(qs || '')) };
}
let _rendering = false, _pending = false;
async function renderRoute(opts) {
  opts = opts || {};
  if (_rendering) { _pending = true; return; }
  _rendering = true;
  try {
    const r = parseHash();
    const changed = r.path !== UI.route.path;
    UI.route = r;
    UI.cache.jobs = await Api.jobs.list();
    UI.cache.settings = await Api.settings.get();
    const view = $('#view');
    const match = ROUTES.map((rt) => ({ rt, m: rt.pattern.exec(r.path) })).find((x) => x.m);
    if (!match) {
      view.innerHTML = emptyState({ error: true, icon: 'alert', title: 'ไม่พบหน้าที่ต้องการ', text: 'ลิงก์ <code>' + esc(location.hash) + '</code> ไม่ถูกต้อง', action: '<a class="btn primary" href="#/dashboard">กลับไป Dashboard</a>' });
    } else {
      try { await match.rt.view(match.m.slice(1), r.query); }
      catch (err) {
        console.error(err);
        view.innerHTML = emptyState({ error: true, icon: 'alert', title: err.code === 'not_found' ? 'ไม่พบข้อมูล' : 'เกิดข้อผิดพลาดในการแสดงผล', text: esc(err.message || String(err)), action: '<a class="btn" href="#/dashboard">กลับไป Dashboard</a> <button class="btn primary" data-action="reload">ลองใหม่</button>' });
      }
    }
    await refreshChrome();
    UI.lastSig = UI.cache.jobs.map((j) => j.id + ':' + j.status).join('|');
    if (changed && !opts.keepScroll) window.scrollTo(0, 0);
    document.title = (match && match.rt.title ? match.rt.title + ' · ' : '') + 'StarNexus Contractor Bidding ' + APP.version;
  } finally {
    _rendering = false;
    if (_pending) { _pending = false; renderRoute({ keepScroll: true }); }
  }
}
function rerender() { return renderRoute({ keepScroll: true }); }
on('reload', () => rerender());
function navigate(hash) { if (location.hash === hash) rerender(); else location.hash = hash; }

let _skipGuard = false, _prevHash = location.hash;

async function viewDashboard() {

  const jobById = Object.fromEntries(jobs.map((j) => [j.id, j]));
  const countable = bids.filter((b) => !b.sealed && b.status !== 'rejected' && jobById[b.jobId] && jobById[b.jobId].status !== 'cancelled');
  const totalBid = countable.reduce((s, b) => s + b.totals.net, 0);

    kpi('#/approvals', 'approve', 'violet', 'รออนุมัติ', fmtNum(pending.length), pending.length ? 'มูลค่า ' + fmtMoney(pending.reduce((s, j) => s + (j.award ? j.award.net : 0), 0), { int: true }) : 'ไม่มีรายการค้าง') +

  const todoHtml = '<div class="card"><div class="card-h"><h2>' + icon('checkCircle') + ' รายการที่ต้องดำเนินการต่อ <span class="hint">(' + todo.length + ')</span></h2></div>' +

    STATUS_ORDER.map((s) => '<button class="fchip ' + (st.status === s ? 'on' : '') + '" data-action="jobsStatus" data-st="' + s + '"><i style="background:' + STATUS[s].color + '"></i>' + STATUS[s].label + ' <span class="n">' + cnt(s) + '</span></button>').join('') + '</div>';

    '<div class="toolbar"><div class="search">' + icon('search') + '<input class="input" type="search" placeholder="ค้นหา Job ID, ชื่องาน, ลูกค้า, สถานที่" value="' + esc(st.q) + '" data-input="jobsSearch" aria-label="ค้นหา Job"></div>' +

function filteredJobs() {
  const st = UI.tables.jobs;
  const sts = st.status ? st.status.split(',') : null;
  let rows = UI.cache.jobs.filter((j) => (!sts || sts.indexOf(j.status) >= 0) && (!st.type || j.type === st.type) && matchText(st.q, j.id, j.title, j.client, j.siteName, j.province));
  const g = (r, k) => k === 'lowest' ? r.stats.lowest : k === 'bids' ? r.stats.submitted : k === 'statusIdx' ? STATUS_ORDER.indexOf(r.status) : r[k];
  return sortBy(rows, st.sort, st.dir, g);
}

  if (bidsCountOf(j)) items.push({ action: 'go', icon: 'scale', label: 'เปรียบเทียบราคา', data: { href: '#/compare/' + j.id } });

  const lowDiff = j.budget && j.stats.lowest ? (j.stats.lowest - j.budget) / j.budget * 100 : null;
  const strip = '<div class="kv-strip">' +

  const tabs = [['details', 'รายละเอียด'], ['items', 'รายการงาน', j.items.length], ['files', 'เอกสารแนบ', j.attachments.length], ['invites', 'ผู้รับเหมา & ลิงก์', j.invitations.length], ['bids', 'ข้อเสนอราคา', bids.length], ['history', 'ประวัติ', audit.length]];
  $('#view').innerHTML =

    '</div>';

const FS = { job: null, isNew: true, attachments: [], hasBids: false, contractors: [], nextId: '' };

async function viewJobForm(id, q) {
  const s = UI.cache.settings, u = Session.user();
  let j;
  if (id) {
    j = await Api.jobs.get(id);
    if (!Rules.isEditable(j)) {
      $('#view').innerHTML = pageHead('แก้ไข ' + esc(j.id), '', '', '<a href="#/jobs">Job ประมูลทั้งหมด</a>' + icon('chevRight', 'sm') + '<a href="#/jobs/' + j.id + '">' + esc(j.id) + '</a>') +
        '<div class="card">' + emptyState({ error: true, icon: 'lock', title: 'Job นี้แก้ไขไม่ได้', text: 'สถานะ "' + STATUS[j.status].label + '" — แก้ไขได้เฉพาะฉบับร่าง หรือ Job ที่ยังไม่เริ่มพิจารณา', action: '<a class="btn primary" href="#/jobs/' + j.id + '">กลับไปหน้ารายละเอียด</a>' }) + '</div>';
      return;
    }
  } else {
    const now = Date.now();
    const close = new Date(now + 7 * DAY); close.setHours(17, 0, 0, 0);
    const open = new Date(now); open.setSeconds(0, 0);
    j = {
      id: '', title: '', type: '', client: '', siteName: '', siteAddress: '', province: '', mapUrl: '', siteNotes: '', scope: '', setCount: '',
      items: [{ id: 'i' + randomToken(6), code: '', name: '', qty: '', unit: 'ชุด', note: '' }], itemPricing: true,
      openAt: open.toISOString(), closeAt: close.toISOString(), installStart: dateOnly(new Date(close.getTime() + 7 * DAY)), deliveryDate: dateOnly(new Date(close.getTime() + 21 * DAY)),
      owner: u.name, ownerPhone: u.phone || '', paymentTerms: s.defaultPayment, warrantyTerms: s.defaultWarranty, notes: '', budget: '', internalNotes: '', attachments: [], invitations: [], status: 'draft', stage: 'draft', stats: { submitted: 0 },
    };
  }
  const contractors = await Api.contractors.list();
  FS.job = j; FS.isNew = !id; FS.attachments = clone(j.attachments || []); FS.hasBids = (j.stats && j.stats.submitted > 0); FS.contractors = contractors;
  FS.nextId = id ? j.id : await Api.jobs.nextId();
  UI.cache.job = id ? j : null;
  UI.formDirty = false;

    '<td><input class="input" name="it_note" value="' + esc(it.note) + '"' + ro + ' aria-label="หมายเหตุ"></td>' +

}
function renumberItems() { $$('#items-body tr').forEach((tr, i) => { tr.firstChild.textContent = i + 1; }); }
on('itemAdd', () => {
  const body = $('#items-body');
  body.insertAdjacentHTML('beforeend', itemRowHtml({ id: 'i' + randomToken(6), code: '', name: '', qty: '', unit: 'ชุด', note: '' }, body.children.length));

on('itemsPaste', async () => {
  const r = await confirmDialog({ title: 'วางรายการงานจาก Excel', icon: 'clip', confirmText: 'เพิ่มรายการ', size: '',
    html: 'คัดลอกคอลัมน์จาก Excel ตามลำดับ: <b>รหัส · รายการ · จำนวน · หน่วย · หมายเหตุ</b> (หนึ่งบรรทัดต่อหนึ่งรายการ)',
    input: { label: 'ข้อมูลที่วาง', type: 'textarea', required: true, placeholder: 'WD-2D\tตู้เสื้อผ้า 2 บาน\t24\tชุด' } });
  if (!r) return;
  const rows = r.value.split(/\r?\n/).map((l) => l.split(/\t|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map((x) => x.replace(/^"|"$/g, '').trim())).filter((c) => c.some(Boolean));
  const body = $('#items-body');
  $$('tr', body).forEach((tr) => { if (!tr.querySelector('[name=it_name]').value && !tr.querySelector('[name=it_qty]').value) tr.remove(); });
  let n = 0;
  rows.forEach((c) => {
    let [code, name, qty, unit, note] = c;
    if (c.length === 1) { name = c[0]; code = ''; }
    if (!isFinite(parseNum(qty)) && /^(ลำดับ|รหัส|code)/i.test(code || '')) return;
    body.insertAdjacentHTML('beforeend', itemRowHtml({ id: 'i' + randomToken(6), code: code || '', name: name || '', qty: isFinite(parseNum(qty)) ? parseNum(qty) : '', unit: unit || 'ชุด', note: note || '' }, body.children.length));
    n++;
  });
  if (!body.children.length) body.insertAdjacentHTML('beforeend', itemRowHtml({ id: 'i' + randomToken(6), code: '', name: '', qty: '', unit: 'ชุด', note: '' }, 0));
  renumberItems(); UI.formDirty = true;
  toast('เพิ่ม ' + n + ' รายการจากข้อมูลที่วาง');
});

async function addFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  let skipped = 0;
  for (const f of files) {
    const a = await readFileForAttachment(f);
    a.uploadedBy = Session.user().name;
    if (!a.stored) skipped++;
    FS.attachments.push(a);
  }
  UI.formDirty = true; renderAttList();
  toast('เพิ่มไฟล์แนบ ' + files.length + ' ไฟล์' + (skipped ? ' (' + skipped + ' ไฟล์ใหญ่เกิน เก็บเฉพาะชื่อ)' : ''), skipped ? 'warning' : 'success');
}

const SEC_OF = { title: 'info', type: 'info', client: 'info', setCount: 'info', owner: 'info', siteName: 'site', siteAddress: 'site', province: 'site', scope: 'scope', items: 'scope', openAt: 'schedule', closeAt: 'schedule', installStart: 'schedule', deliveryDate: 'schedule', paymentTerms: 'terms', warrantyTerms: 'terms' };
function validateForm(publish) {
  const d = collectJobForm();
  if (!FS.isNew && FS.job.stage !== 'draft') d.invitations = FS.job.invitations;
  const v = Rules.validateJob(d, { publish, settings: UI.cache.settings });
  const form = $('#job-form');

  if (!FS.isNew && FS.job.stage !== 'draft' && d.closeAt === FS.job.closeAt) errs = errs.filter((e) => !(e.field === 'closeAt' && /อนาคต/.test(e.msg)));
  $$('#form-nav a').forEach((a) => a.classList.remove('bad'));
  if (errs.length) {

    $('#err-box').innerHTML = '<div class="err-summary"><b>' + icon('alert', 'sm') + ' กรุณาแก้ไขข้อมูล ' + errs.length + ' รายการก่อน' + (publish ? ' Publish' : 'บันทึก') + '</b><ul>' +

on('compareSide', async () => {

function contractorPerf(jobs, bids, cons) {
  return cons.map((c) => {
    const invJobs = jobs.filter((j) => j.invitations.some((i) => i.contractorId === c.id));
    const viewed = invJobs.filter((j) => j.invitations.find((i) => i.contractorId === c.id).viewedAt).length;
    const bs = bids.filter((b) => b.contractorId === c.id);
    const diffs = [];
    bs.forEach((b) => {
      if (b.sealed || b.status === 'rejected') return;
      const peers = bids.filter((x) => x.jobId === b.jobId && !x.sealed && x.status !== 'rejected');
      if (peers.length < 2) return;
      const low = Math.min.apply(null, peers.map((x) => x.totals.net));
      diffs.push((b.totals.net - low) / low * 100);
    });
    const won = bs.filter((b) => b.status === 'winner').length, decided = bs.filter((b) => b.status === 'winner' || b.status === 'lost').length;
    return { c, invited: invJobs.length, viewed, submitted: bs.length, response: invJobs.length ? bs.length / invJobs.length * 100 : null, shortlisted: bs.filter((b) => b.status === 'shortlisted' || b.status === 'winner').length,
      won, winRate: decided ? won / decided * 100 : null, avgDiff: diffs.length ? diffs.reduce((s, x) => s + x, 0) / diffs.length : null, value: bs.filter((b) => b.status === 'winner').reduce((s, b) => s + b.totals.net, 0) };
  });
}

on('openStarNexus', () => {

  if (!/^https?:\/\//.test(url)) { toast('ระบุลิงก์ระบบ StarNexus เดิมก่อน (ขึ้นต้นด้วย https://)', 'info'); return; }
  window.open(url, '_blank', 'noopener');
});
on('resetDemo', async () => {
  const r = await confirmDialog({ title: 'Reset Demo Data?', tone: 'warn', icon: 'refresh', confirmText: 'Reset ข้อมูล', message: 'ข้อมูลทั้งหมดในเบราว์เซอร์นี้จะถูกแทนที่ด้วยข้อมูลตัวอย่างเริ่มต้น (การตั้งค่าจะกลับเป็นค่าเริ่มต้นด้วย) — ย้อนกลับไม่ได้' });
  if (!r) return;
  await Api.system.reset();
  UI.formDirty = false; UI.tables.contractors.selected = []; UI.tables.compare.selected = [];
  toast('คืนค่าข้อมูลตัวอย่างเรียบร้อย');
  navigate('#/dashboard');
});
on('emptySystem', async () => {
  const r = await confirmDialog({ title: 'ล้างข้อมูลทั้งหมด?', tone: 'danger', icon: 'trash', confirmText: 'ล้างข้อมูล', message: 'Job ผู้รับเหมา ข้อเสนอ และประวัติทั้งหมดจะถูกลบ (คงการตั้งค่าไว้)',
    input: { label: 'พิมพ์คำว่า ล้างข้อมูล เพื่อยืนยัน', required: true, validate: (v) => (v === 'ล้างข้อมูล' ? '' : 'กรุณาพิมพ์ "ล้างข้อมูล"') } });
  if (!r) return;
  await Api.system.empty();
  toast('ล้างข้อมูลแล้ว — เริ่มต้นระบบว่าง', 'warning');
  navigate('#/dashboard');
});
on('exportJson', async () => {
  const text = await Api.system.exportJson();
  downloadFile('starnexus_bidding_backup_' + dateOnly(new Date()) + '.json', text, 'application/json');
  toast('ส่งออกข้อมูลสำรองแล้ว');
});
on('importJson', () => {
  const fi = $('#import-file');
  fi.onchange = async () => {
    const f = fi.files[0]; fi.value = '';
    if (!f) return;
    const text = await f.text();
    const r = await confirmDialog({ title: 'นำเข้าข้อมูลจาก ' + f.name + '?', tone: 'warn', confirmText: 'นำเข้า', message: 'ข้อมูลปัจจุบันในเบราว์เซอร์นี้จะถูกแทนที่ทั้งหมด' });
    if (!r) return;
    try { await Api.system.importJson(text); toast('นำเข้าข้อมูลเรียบร้อย'); navigate('#/dashboard'); } catch (e) { handleError(e); }
  };
  fi.click();
});

/* ===================== [10] CONTRACTOR PORTAL =====================
   เปิดด้วย index.html?job=<JobID>&inv=<token>
   หน้าจอนี้ได้ข้อมูลผ่าน Api.portal.* เท่านั้น (ตัดข้อมูลลับแบบ whitelist) และไม่แสดงราคาของผู้รับเหมารายอื่น */
const P = { jobId: '', token: '', pj: null, state: '', me: null, bid: null, mode: 'view', receipt: null, timer: null };
const PORTAL_BID_STATUS = {
  submitted: { label: 'ส่งข้อเสนอแล้ว', tone: 'blue', text: 'บริษัทได้รับข้อเสนอของท่านแล้ว แก้ไขได้จนถึงเวลาปิดรับ' },
  reviewing: { label: 'อยู่ระหว่างพิจารณา', tone: 'violet', text: 'ปิดรับข้อเสนอแล้ว บริษัทกำลังพิจารณา จะแจ้งผลให้ทราบ' },
  won: { label: 'ได้รับการคัดเลือก', tone: 'green', text: 'ยินดีด้วย ท่านได้รับการคัดเลือก เจ้าหน้าที่จะติดต่อเพื่อทำใบสั่งจ้าง/สัญญา' },
  lost: { label: 'ไม่ได้รับการคัดเลือก', tone: 'slate', text: 'ขอบคุณที่ร่วมเสนอราคา ในครั้งนี้ท่านไม่ได้รับการคัดเลือก' },
  cancelled: { label: 'งานถูกยกเลิก', tone: 'red', text: 'บริษัทได้ยกเลิกงานนี้' },
};
const PUBLIC_STATUS_LABEL = { scheduled: 'ยังไม่เปิดรับข้อเสนอ', open: 'เปิดรับข้อเสนอ', closing: 'ใกล้ปิดรับข้อเสนอ', closed: 'ปิดรับข้อเสนอแล้ว', awarded: 'ประกาศผลแล้ว', cancelled: 'ยกเลิก' };
const PUBLIC_STATUS_TONE = { scheduled: 'indigo', open: 'green', closing: 'orange', closed: 'slate', awarded: 'slate', cancelled: 'red' };

async function bootPortal(params) {
  document.title = 'เสนอราคางานติดตั้ง ' + params.get('job') + ' · StarNexus';
  P.jobId = (params.get('job') || '').trim();
  P.token = (params.get('inv') || '').trim();
  try { if (!P.token) { const t = sessionStorage.getItem('snb_inv_' + P.jobId); if (t) P.token = t; } } catch (e) { /* ignore */ }
  await portalLoad();
  if (P.me && P.state !== 'not_found') await Api.portal.recordView(P.jobId, P.token);
  portalRender();
  P.timer = setInterval(portalTick, 1000);
  window.addEventListener('storage', async (e) => {
    if (e.key !== APP.storageKey) return;
    const before = P.state;
    await portalLoad();
    const acc = (s) => s === 'open' || s === 'closing';
    if (before !== P.state && !(acc(before) && acc(P.state))) { toast('สถานะงานเปลี่ยนเป็น "' + (PUBLIC_STATUS_LABEL[P.state] || P.state) + '"', 'info'); P.mode = 'view'; portalRender(); }
  });
}
async function portalLoad() {
  const r = await Api.portal.getJob(P.jobId);
  P.state = r.state; P.pj = r.job || null;
  UI.cache.attJob = P.pj;
  P.me = P.token && P.pj ? await Api.portal.resolve(P.jobId, P.token) : null;
  P.bid = P.me ? await Api.portal.myBid(P.jobId, P.token) : null;
}
function portalTick() {
  if (!P.pj) return;
  const el = $('#p-timer'); if (!el) return;
  const target = P.state === 'scheduled' ? P.pj.openAt : P.pj.closeAt;
  const ms = Date.parse(target) - Date.now();
  if (ms <= 0 && (P.state === 'open' || P.state === 'closing' || P.state === 'scheduled')) {
    portalLoad().then(() => { toast(P.state === 'closed' ? 'หมดเวลา — ปิดรับข้อเสนอแล้ว' : 'สถานะงานเปลี่ยนแล้ว', 'warning'); P.mode = 'view'; portalRender(); });
    clearInterval(P.timer); P.timer = setInterval(portalTick, 1000);
    return;
  }
  el.querySelector('b').textContent = fmtClock(ms);
  const soon = P.state !== 'scheduled' && ms <= (P.pj.rules ? 48 : 48) * HOUR;
  el.classList.toggle('soon', soon);
}

  return '<header class="p-header"><div class="inner"><div class="brand-mark"><svg viewBox="0 0 24 24">' + ICONS.starMark + '</svg></div><div class="brand-text"><b>StarNexus</b><span>Contractor Portal · ระบบเสนอราคางานติดตั้ง</span></div>' +
    '<div class="who">' + (contractor ? '<span>เข้าใช้งานในนาม</span><b>' + esc(contractor.company) + '</b>' + esc(contractor.id) : '<span>ผู้รับเหมา</span><b>ยังไม่ได้ยืนยันตัวตน</b>') + '</div></div></header>';
}

function portalFooter() {
  return '<footer class="p-foot">' + icon('shield', 'sm') + ' ข้อมูลราคาของท่านเป็นความลับ ผู้รับเหมารายอื่นไม่เห็นราคาของท่าน · ' + APP.name + ' ' + APP.version + ' (Prototype — ข้อมูลเก็บในเบราว์เซอร์นี้ ใช้ทดสอบเท่านั้น)</footer>';

function portalHero(pj, opts) {
  opts = opts || {};
  const st = pj.status;
  const target = st === 'scheduled' ? pj.openAt : pj.closeAt;
  const ms = Date.parse(target) - Date.now();
  const timer = (st === 'open' || st === 'closing' || st === 'scheduled') && isFinite(ms) ? '<div class="p-timer ' + (st === 'closing' ? 'soon' : '') + '" id="' + (opts.preview ? 'pv-timer' : 'p-timer') + '">' + icon('clock') + (st === 'scheduled' ? 'เปิดรับข้อเสนอในอีก' : 'ปิดรับข้อเสนอในอีก') + ' <b>' + fmtClock(ms) + '</b></div>'
    : st === 'closed' || st === 'awarded' ? '<div class="p-timer over">' + icon('lock') + ' ปิดรับข้อเสนอแล้วเมื่อ ' + fmtDateTime(pj.closeAt) + '</div>' : '';
  return '<section class="p-hero"><div class="inner"><div class="row"><span class="mono" style="opacity:.85">' + esc(pj.id) + '</span><span class="badge t-' + (PUBLIC_STATUS_TONE[st] || 'slate') + '">' + (PUBLIC_STATUS_LABEL[st] || st) + '</span><span class="badge plain" style="background:rgba(255,255,255,.12);color:#fff">' + esc(pj.type || '') + '</span></div>' +
    '<h1>' + esc(pj.title) + '</h1><div class="meta"><span>' + icon('building', 'sm') + esc(pj.client) + '</span><span>' + icon('pin', 'sm') + esc(pj.siteName) + ' จ.' + esc(pj.province) + '</span><span>' + icon('calendar', 'sm') + 'เข้าติดตั้ง ' + fmtDate(pj.installStart) + '</span><span>' + icon('clock', 'sm') + 'ปิดรับ ' + fmtDateTime(pj.closeAt) + '</span></div>' + timer + (opts.cta ? '<button class="btn p-cta" data-action="portalScrollForm">' + icon('edit') + ' ' + opts.cta + '</button>' : '') + '</div></section>';
}
function portalJobSections(pj) {
  const dur = daysBetween(pj.installStart, pj.deliveryDate);
  return '<div class="card"><div class="card-h"><h2>' + icon('info') + ' รายละเอียดงาน</h2></div><div class="card-b">' + dl([['Job ID', '<span class="mono">' + esc(pj.id) + '</span>'], ['ชื่องาน', esc(pj.title)], ['ประเภทงาน', esc(pj.type)], ['ลูกค้า / โครงการ', esc(pj.client)], ['จำนวนชุดเฟอร์นิเจอร์', fmtNum(pj.setCount) + ' ชุด'], ['ผู้ประสานงาน', esc(pj.coordinator.name) + (pj.coordinator.phone ? ' · <a href="tel:' + esc(pj.coordinator.phone) + '">' + esc(pj.coordinator.phone) + '</a>' : '')]]) + '</div></div>' +
    '<div class="card"><div class="card-h"><h2>' + icon('pin') + ' สถานที่และวันเวลา</h2></div><div class="card-b">' + dl([['สถานที่ติดตั้ง', esc(pj.siteName)], ['ที่อยู่', esc(pj.siteAddress + ' จ.' + pj.province)],
      pj.mapUrl ? ['แผนที่', '<a href="' + esc(pj.mapUrl) + '" target="_blank" rel="noopener">' + icon('pin', 'sm') + ' เปิด Google Maps</a>'] : null, pj.siteNotes ? ['การเข้าพื้นที่', '<span class="pre">' + esc(pj.siteNotes) + '</span>'] : null,

function collectBid(pj) {
  const f = $('#bid-form'); if (!f) return {};
  const g = (n) => { const el = f.querySelector('[name="' + n + '"]'); return el ? el.value : ''; };
  const unitPrices = {};
  if (pj.itemPricing) pj.items.forEach((it) => { unitPrices[it.id] = g('unit_' + it.id); });
  const vm = f.querySelector('[name=vatMode]:checked');
  return {
    unitPrices, lumpSum: g('lumpSum'), labor: g('labor'), transport: g('transport'), extra: g('extra'), extraDesc: g('extraDesc'), vatMode: vm ? vm.value : '',
    durationDays: g('durationDays'), teamSize: g('teamSize'), startDate: g('startDate'), warrantyMonths: g('warrantyMonths'), validityDays: g('validityDays'),
    acceptPayment: f.acceptPayment.checked, paymentTerms: g('paymentTerms'), conditions: g('conditions'), notes: g('notes'), signerName: g('signerName'), signerPhone: g('signerPhone'), ack: f.ack.checked,
  };
}
function recalcBid(pj) {
  const f = $('#bid-form'); if (!f) return;
  const t = Rules.calcBid(collectBid(pj), pj, pj.rules.vatRate);
  if (pj.itemPricing) { t.lines.forEach((l) => { const c = f.querySelector('[data-amt="' + l.itemId + '"]'); if (c) c.textContent = l.amount ? fmtMoney(l.amount) : '—'; }); const b = $('#bf-base'); if (b) b.textContent = fmtMoney(t.base); }
  const set = (id, v) => { $$('#' + id).forEach((el) => { el.textContent = v; }); };
  set('pt-net', fmtMoney(t.net)); set('pt-words', bahtText(t.net)); set('pt-base', fmtMoney(t.base)); set('pt-labor', fmtMoney(t.labor)); set('pt-transport', fmtMoney(t.transport)); set('pt-extra', fmtMoney(t.extra));
  set('pt-vat', t.vatMode === 'none' ? 'ไม่มี' : fmtMoney(t.vat)); set('pt-vatlbl', t.vatMode === 'inclusive' ? 'รวม VAT ' + t.vatRate + '% แล้ว' : t.vatMode === 'none' ? 'VAT' : 'VAT ' + t.vatRate + '%');
  set('pm-net', fmtMoney(t.net));
  return t;
}
function bindBidForm(pj) {
  const f = $('#bid-form'); if (!f) return;
  f.addEventListener('input', (e) => { if (e.target.dataset.calc) recalcBid(pj); });
  f.addEventListener('change', (e) => {
    if (e.target.dataset.calc) recalcBid(pj);
    if (e.target.name === 'acceptPayment') f.querySelector('[name=paymentTerms]').classList.toggle('hidden', e.target.checked);
    const fld = e.target.closest('.field.invalid'); if (fld) fld.classList.remove('invalid');
  });
  $$('input.money', f).forEach((el) => el.addEventListener('blur', () => { const v = parseNum(el.value); if (isFinite(v)) el.value = money(v); }));
  recalcBid(pj);
}

      '<div class="xs muted" style="margin-top:10px">ระบบจริงจะยืนยันด้วยรหัส OTP ทางอีเมล/โทรศัพท์</div></div></div>';
    main = portalJobSections(pj);
  } else if (!me.active) {

    notice(b.status === 'won' ? 'success' : b.status === 'lost' ? 'info' : b.status === 'reviewing' ? 'info' : 'success', s.text, b.status === 'won' ? 'trophy' : 'info') +

    '<div><table class="sum-table"><tr><td>ราคาที่เสนอ</td><td>' + fmtMoney(b.totals.base) + '</td></tr><tr><td>ค่าแรง</td><td>' + fmtMoney(b.totals.labor) + '</td></tr><tr><td>ค่าขนส่ง</td><td>' + fmtMoney(b.totals.transport) + '</td></tr><tr><td>ค่าใช้จ่ายเพิ่มเติม</td><td>' + fmtMoney(b.totals.extra) + '</td></tr><tr><td>' + VAT_MODES[b.totals.vatMode] + '</td><td>' + fmtMoney(b.totals.vat) + '</td></tr><tr class="total"><td>ยอดรวมสุทธิ</td><td>' + fmtMoney(b.totals.net) + '</td></tr></table></div></div>' +
    (b.history.length ? '<div class="small muted" style="margin-top:10px">ประวัติ: ' + b.history.map((h) => 'R' + h.revision + ' ' + fmtMoney(h.net) + ' (' + fmtDateTime(h.submittedAt) + ')').join(' · ') + '</div>' : '') + '</div></div>';
}
function myBidPanel(pj, b, accepting) {
  if (!b) return statusPanel(pj);
  const s = PORTAL_BID_STATUS[b.status] || PORTAL_BID_STATUS.submitted;
  return '<div class="p-total"><div class="lbl">ข้อเสนอของท่าน · ' + s.label + '</div><div class="amt">' + fmtMoney(b.totals.net) + '</div><div class="words">' + bahtText(b.totals.net) + '</div>' +
    '<table><tr><td>เลขอ้างอิง</td><td class="mono">' + esc(b.ref) + '</td></tr><tr><td>ส่งเมื่อ</td><td>' + fmtDateTime(b.submittedAt) + '</td></tr></table>' +
    (accepting ? (b.canEdit ? '<button class="btn lg block" style="margin-top:14px;background:var(--gold);border-color:var(--gold);color:#2B1D00" data-action="portalEdit">' + icon('edit') + ' แก้ไขข้อเสนอ</button><div class="xs" style="margin-top:6px;color:#C9D4E5">แก้ไขได้อีก ' + b.editsLeft + ' ครั้ง ก่อน ' + fmtDateTime(pj.closeAt) + '</div>'
      : '<div class="small" style="margin-top:12px;color:#F5C97A">' + (pj.rules.allowEdit ? 'แก้ไขครบจำนวนครั้งที่กำหนดแล้ว' : 'งานนี้ไม่อนุญาตให้แก้ไขหลังส่ง') + '</div>') : '<div class="small" style="margin-top:12px;color:#C9D4E5">' + icon('lock', 'sm') + ' ปิดรับข้อเสนอแล้ว — แก้ไขไม่ได้</div>') +
    '<button class="btn block" style="margin-top:8px;background:transparent;color:#fff;border-color:rgba(255,255,255,.3)" data-action="portalPrint">' + icon('print') + ' พิมพ์ / บันทึก PDF</button></div>';
}
function receiptHtml(pj, me, r) {
  return '<div class="receipt"><div class="r-head"><div class="r-ico">' + icon('check', 'lg') + '</div><div><div class="strong">ส่งข้อเสนอราคา' + (r.revision > 1 ? 'ฉบับแก้ไข' : '') + 'เรียบร้อยแล้ว</div><div class="small text-2">บันทึกเมื่อ ' + fmtDateTimeSec(r.submittedAt) + '</div></div></div>' +
    '<div class="card-b"><div class="grid g2"><div><div class="label">เลขอ้างอิง</div><div class="r-ref" id="receipt-ref">' + esc(r.ref) + '</div><div class="small muted" style="margin-top:6px">กรุณาเก็บเลขอ้างอิงนี้ไว้สำหรับติดต่อบริษัท</div>' +
    '<div class="small" style="margin-top:10px">' + esc(me.company) + '<br>Job ' + esc(pj.id) + ' · ' + esc(pj.title) + '</div></div>' +
    '<div><table class="sum-table"><tr><td>ราคาที่เสนอ</td><td>' + fmtMoney(r.totals.base) + '</td></tr><tr><td>ค่าแรง</td><td>' + fmtMoney(r.totals.labor) + '</td></tr><tr><td>ค่าขนส่ง</td><td>' + fmtMoney(r.totals.transport) + '</td></tr><tr><td>ค่าใช้จ่ายเพิ่มเติม</td><td>' + fmtMoney(r.totals.extra) + '</td></tr>' +
    '<tr><td>' + (r.totals.vatMode === 'none' ? 'VAT (ไม่จดทะเบียน)' : r.totals.vatMode === 'inclusive' ? 'VAT ' + r.totals.vatRate + '% (รวมในราคา)' : 'VAT ' + r.totals.vatRate + '%') + '</td><td>' + fmtMoney(r.totals.vat) + '</td></tr><tr class="total"><td>ยอดรวมสุทธิ</td><td id="receipt-net">' + fmtMoney(r.totals.net) + '</td></tr></table><div class="xs muted right">(' + bahtText(r.totals.net) + ')</div></div></div>' +
    '<div class="row" style="margin-top:14px"><button class="btn" data-action="portalPrint">' + icon('print') + ' พิมพ์ / บันทึก PDF</button>' + (r.bid && r.bid.canEdit ? '<button class="btn" data-action="portalEdit">' + icon('edit') + ' แก้ไขข้อเสนอ</button>' : '') + '<button class="btn ghost" data-action="portalBack">ดูรายละเอียดงาน</button></div></div></div>';
}

/* ---------- Portal actions ---------- */
on('portalIdentify', async () => {
  const f = $('#id-form');
  const code = f.code.value.trim(), email = f.email.value.trim();
  const errs = [];
  if (!/^CT-\d{3,}$/i.test(code)) errs.push({ field: 'code', msg: 'รูปแบบ CT-001' });
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errs.push({ field: 'email', msg: 'อีเมลไม่ถูกต้อง' });
  if (errs.length) { showFieldErrors(f, errs); return; }
  const token = await Api.portal.identify(P.jobId, code, email);
  P.token = token;
  try { sessionStorage.setItem('snb_inv_' + P.jobId, token); } catch (e) { /* ignore */ }
  history.replaceState(null, '', location.pathname + '?job=' + encodeURIComponent(P.jobId) + '&inv=' + encodeURIComponent(token));
  await portalLoad();
  await Api.portal.recordView(P.jobId, P.token);
  toast('ยืนยันตัวตนแล้ว — ' + (P.me ? P.me.company : ''));
  P.mode = 'view'; portalRender();
});
on('portalEdit', async () => {
  await portalLoad();
  if (!(P.state === 'open' || P.state === 'closing')) { toast('ปิดรับข้อเสนอแล้ว แก้ไขไม่ได้', 'error'); P.mode = 'view'; portalRender(); return; }
  if (!P.bid || !P.bid.canEdit) { toast('แก้ไขข้อเสนอไม่ได้แล้ว', 'warning'); return; }
  P.mode = 'form'; portalRender();
  const f = $('#bid-form'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
on('portalCancelEdit', () => { P.mode = 'view'; portalRender(); });
on('portalScrollForm', () => { const f = $('#bid-form'); if (f) { f.scrollIntoView({ behavior: 'smooth', block: 'start' }); const i = f.querySelector('input:not([type=radio]):not([type=checkbox])'); if (i) setTimeout(() => i.focus({ preventScroll: true }), 400); } });
on('portalBack', () => { P.mode = 'view'; portalRender(); });
on('portalPrint', () => {
  const b = P.bid; if (!b) return;
  const pseudo = { ref: b.ref, revision: b.revision, submittedAt: b.submittedAt, totals: b.totals, data: b.data, contractorName: P.me.company, contractor: { contact: P.me.contact, phone: P.me.phone, email: P.me.email } };
  printHtml(b.ref, quotationHtml(pseudo, P.pj, { companyName: P.pj.company.name }));
});
on('portalSubmit', async (el) => {
  const pj = P.pj;
  const input = collectBid(pj);
  const errs = Rules.validateBid(input, pj);
  const f = $('#bid-form'), box = $('#bf-err');
  if (Object.keys(errs).length) {
    const first = showFieldErrors(f, errs);
    box.classList.remove('hidden');
    box.innerHTML = '<b>' + icon('alert', 'sm') + ' กรุณาตรวจสอบข้อมูล ' + Object.keys(errs).length + ' รายการ</b><ul>' + Object.keys(errs).map((k) => '<li>' + esc(errs[k]) + '</li>').join('') + '</ul>';
    (first || box).scrollIntoView({ behavior: 'smooth', block: 'center' });
    toast('ข้อมูลยังไม่ครบถ้วน', 'warning');
    return;
  }
  box.classList.add('hidden'); clearFieldErrors(f);
  const t = Rules.calcBid(input, pj, pj.rules.vatRate);
  const r = await confirmDialog({ title: P.bid ? 'ยืนยันส่งข้อเสนอฉบับแก้ไข' : 'ยืนยันส่งข้อเสนอราคา', tone: 'success', icon: 'send', confirmText: 'ยืนยันส่งข้อเสนอ', size: '',
    html: 'งาน <b>' + esc(pj.id) + '</b> · ' + esc(pj.title),
    details: '<table class="sum-table" style="margin-top:12px"><tr><td>ราคาที่เสนอ</td><td>' + fmtMoney(t.base) + '</td></tr><tr><td>ค่าแรง + ค่าขนส่ง + ค่าใช้จ่ายเพิ่มเติม</td><td>' + fmtMoney(t.labor + t.transport + t.extra) + '</td></tr><tr><td>VAT</td><td>' + fmtMoney(t.vat) + '</td></tr><tr class="total"><td>ยอดรวมสุทธิ</td><td>' + fmtMoney(t.net) + '</td></tr></table>' +
      '<div class="xs muted right">(' + bahtText(t.net) + ')</div><div class="small muted" style="margin-top:10px">ระยะเวลาติดตั้ง ' + esc(input.durationDays) + ' วัน · รับประกัน ' + esc(input.warrantyMonths) + ' เดือน · ยืนราคา ' + esc(input.validityDays) + ' วัน</div>' });
  if (!r) return;
  try {
    const res = await Api.portal.submitBid(P.jobId, P.token, input);
    P.receipt = Object.assign({}, res);
    P.receipt.bid = res.bid;
    await portalLoad();
    P.mode = 'receipt';
    portalRender();
    window.scrollTo(0, 0);
    toast('ส่งข้อเสนอเรียบร้อย เลขอ้างอิง ' + res.ref);
  } catch (e) {
    if (e.code === 'closed') { await portalLoad(); P.mode = 'view'; portalRender(); }
    if (e.code === 'validation' && e.details) showFieldErrors($('#bid-form'), e.details);
    throw e;
  }
});

/* ---------- Admin: preview มุมมองผู้รับเหมา ---------- */
async function openPortalPreview(jobLike) {
  const pj = await Api.portal.previewJob(Object.assign({}, jobLike, { stage: 'published' }));
  pj.status = jobLike.status && PUBLIC_STATUS_LABEL[jobLike.status] ? jobLike.status : (jobLike.status === 'review' || jobLike.status === 'pending' ? 'closed' : 'open');
  const prev = UI.cache.attJob;
  UI.cache.attJob = pj;
  const body = '<div class="preview-banner">' + icon('eye', 'sm') + ' ตัวอย่างมุมมองผู้รับเหมา — ข้อมูลลับ (งบประมาณ หมายเหตุภายใน เอกสารภายใน) ถูกตัดออกแล้ว</div>' +
    '<div class="portal" style="min-height:0">' + portalHero(pj, { preview: true }) + '<div class="p-body" style="padding-bottom:20px"><div class="stack">' + portalJobSections(pj) + bidFormHtml(pj, { contact: 'ผู้รับเหมาตัวอย่าง', phone: '' }, null, { disabled: true }) + '</div><aside class="p-side">' + totalPanelHtml(pj, { disabled: true }) + '</aside></div></div>';
  const m = Modal.open({ title: icon('eye') + ' Preview — หน้าผู้รับเหมา', titleText: 'Preview', sub: esc(pj.id || 'Job ใหม่') + ' · ลิงก์: ' + esc(bidLink(pj.id || 'NEW')), size: 'xl', body,
    footer: '<button class="btn" data-close>ปิด</button>', onClose: () => { UI.cache.attJob = prev; } });
  m.el.querySelector('.modal-b').style.padding = '0';
  recalcBid(pj);
}


/* ===================== [11] BOOT ===================== */
async function adminTick() {
  LocalBackend.syncTimeEvents();
  updateCountdowns();
  const jobs = await Api.jobs.list();
  const sig = jobs.map((j) => j.id + ':' + j.status).join('|');
  if (sig !== UI.lastSig) {
    UI.lastSig = sig;
    const typing = document.activeElement && document.activeElement.matches && document.activeElement.matches('input,textarea,select');
    if (!UI.formDirty && !Modal.isOpen && !typing) { UI.cache.jobs = jobs; await rerender(); } else { UI.cache.jobs = jobs; await refreshChrome(); }
  }
}
async function bootAdmin(initRes) {
  renderShell();
  if (!LocalStore.available) toast('เบราว์เซอร์นี้ไม่อนุญาต LocalStorage — ข้อมูลจะหายเมื่อรีเฟรช', 'error', 9000);
  if (initRes && initRes.error) toast(initRes.error.message + ' — โหลดข้อมูลตัวอย่างแทน', 'error', 9000);
  else if (initRes && initRes.seeded) toast('โหลดข้อมูลตัวอย่างแล้ว (Reset ได้ที่เมนูตั้งค่าระบบ)', 'info');
  await renderRoute();
  setInterval(() => { adminTick().catch((e) => console.warn(e)); }, 30000);
  window.addEventListener('storage', (e) => {
    if (e.key === APP.storageKey) {
      LocalBackend.reload();
      if (!UI.formDirty && !Modal.isOpen) rerender(); else toast('มีข้อมูลอัปเดตจากแท็บอื่น — บันทึกหรือปิดหน้าต่างแล้วรีเฟรช', 'info');
    } else if (e.key === APP.sessionKey) rerender();
  });
}
async function boot() {
  let initRes;
  try { initRes = LocalBackend.init(); }
  catch (e) {
    document.getElementById('root').innerHTML = '<div class="content">' + emptyState({ error: true, icon: 'alert', title: 'เริ่มระบบไม่สำเร็จ', text: esc(e.message) }) + '</div>';
    return;
  }
  LocalBackend.syncTimeEvents();
  const params = new URLSearchParams(location.search);
  if (params.has('job')) await bootPortal(params);
  else await bootAdmin(initRes);
}
window.addEventListener('unhandledrejection', (e) => { handleError(e.reason); });
/* เปิดให้ทดสอบ/ดีบักใน Console (Prototype) */
window.SNB = { APP, Api, Rules, Session, version: APP.version, tick: () => adminTick() };
boot();
})();
